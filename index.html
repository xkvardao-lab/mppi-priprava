<script>
const DATA = [{"id": "t1", "n": 1, "short": "Pamäť a CPU", "kicker": "Prednáška 1 + 2 (bitové operácie)", "title": "Pamäť, CPU, registre a adresovanie", "lead": "Ako je procesor poskladaný, kde má pamäť, aké registre používa a ako sa v C mení jeden bit.", "explain": "<h3>Ako vôbec funguje mikropočítač<\/h3>\n<p>Program je <b class=\"t\">zoznam inštrukcií<\/b> v pamäti. Procesor robí stále dokola to isté: prečíta inštrukciu, rozlíši čo znamená (dekodér), vykoná ju (<b class=\"t\">ALU<\/b> = aritmeticko-logická jednotka) a ide na ďalšiu. Na to, ktorú inštrukciu číta práve teraz, má čítač <b class=\"t\">PC<\/b> (Program Counter), ktorý ukazuje adresu ďalšej inštrukcie.<\/p>\n<div class=\"tip\"><span class=\"tl\">Ako si to zapamätať<\/span>Kuchár a recept: pamäť programu je kuchárska kniha, PC je prst na riadku, ktorý práve čítaš, ALU sú ruky, ktoré krájajú a miešajú, a RAM sú suroviny na stole.<\/div>\n<p>Pamäť je skriňa so zásuvkami. Každá zásuvka má <b class=\"t\">adresu<\/b> (číslo) a drží 1 byte (8 bitov). Ak má adresa 16 bitov (16 drôtov), existuje 2<sup>16<\/sup> = 65 536 zásuviek, teda 64 kB. Presne tak je to pri MSP430.<\/p>\n\n<h3>Von Neumann vs. Harvard<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>von Neumann<\/th><th>Harvard<\/th><\/tr>\n<tr><td>Pamäť<\/td><td>jeden spoločný priestor pre inštrukcie aj dáta<\/td><td>dva oddelené priestory<\/td><\/tr>\n<tr><td>Zbernice<\/td><td>1 adresná + 1 dátová, zdieľané v čase<\/td><td>2 adresné + 2 dátové<\/td><\/tr>\n<tr><td>Výhoda<\/td><td>jednoduchšie obvody<\/td><td>inštrukcia aj dáta naraz, rýchlejšie<\/td><\/tr>\n<tr><td>Nevýhoda<\/td><td>pomalšie, v jednom čase len jedna vec<\/td><td>zložitejšia stavba<\/td><\/tr>\n<\/table><\/div>\n<p><b class=\"t\">MSP430 je von Neumann.<\/b> Má jednu 16-bitovú adresnú zbernicu <code>MAB<\/code> a jednu dátovú <code>MDB<\/code>. Po tej istej ceste raz ide inštrukcia z FLASH a raz dáta z RAM, vždy len jedno naraz.<\/p>\n<div class=\"tip\"><span class=\"tl\">Ako si to zapamätať<\/span>Von Neumann = jedna cesta, autá sa striedajú. Harvard = dve cesty, idú naraz.<\/div>\n\n<h3>Pamäťový model MSP430G2553<\/h3>\n<p>Celý procesor má <b class=\"t\">jeden adresný priestor<\/b> a v ňom je všetko pokope:<\/p>\n<div class=\"tw\"><table>\n<tr><th>Adresa<\/th><th>Čo tam je<\/th><\/tr>\n<tr><td><code>0x0000 – 0x000F<\/code><\/td><td>registre špeciálnych funkcií (SFR)<\/td><\/tr>\n<tr><td><code>0x0010 – 0x00FF<\/code><\/td><td>8-bitové registre periférií (napr. <code>P1OUT<\/code> na <code>0x21<\/code>)<\/td><\/tr>\n<tr><td><code>0x0100 – 0x01FF<\/code><\/td><td>16-bitové registre periférií<\/td><\/tr>\n<tr><td><code>0x0200 – 0x03FF<\/code><\/td><td><b>RAM<\/b> (dáta)<\/td><\/tr>\n<tr><td><code>0x1000 – 0x10FF<\/code><\/td><td>informačná FLASH (tu sú aj kalibračné hodnoty hodín)<\/td><\/tr>\n<tr><td><code>0xC000 – 0xFFFF<\/code><\/td><td><b>FLASH<\/b> (program), úplne na konci vektory prerušení <code>0xFFC0–0xFFFF<\/code><\/td><\/tr>\n<\/table><\/div>\n<p>Dôležitý pojem: registre sú <b class=\"t\">pamäťovo mapované<\/b>. Majú pevnú adresu v tom istom priestore ako RAM, takže do nich zapisuješ ako do pamäte. Preto <code>P1OUT = 1;<\/code> je vlastne zápis na adresu <code>0x21<\/code>.<\/p>\n<p>FLASH si pamätá obsah aj po vypnutí (program, konštanty), zapisuje sa pomalšie. RAM po vypnutí zabudne, ale je rýchla (dočasné dáta).<\/p>\n\n<h3>RISC vs. CISC<\/h3>\n<p><b class=\"t\">RISC<\/b>: málo jednoduchých a rýchlych inštrukcií, zložitú vec poskladáš z viacerých. <b class=\"t\">CISC<\/b>: zložité inštrukcie, trvajú dlhšie, a aj keď chceš len jednoduchú operáciu, musíš použiť tú zložitú. <b>MSP430 = RISC<\/b> (27 základných inštrukcií, 7 adresovacích režimov).<\/p>\n\n<h3>Registre CPU<\/h3>\n<p>CPU má 16 registrov, každý 16-bitový:<\/p>\n<div class=\"tw\"><table>\n<tr><th>Register<\/th><th>Úloha<\/th><\/tr>\n<tr><td><code>R0 = PC<\/code><\/td><td>adresa ďalšej inštrukcie. Inštrukcie majú 2, 4 alebo 6 bajtov, preto je adresa vždy párna a <b>bit 0 je vždy 0<\/b><\/td><\/tr>\n<tr><td><code>R1 = SP<\/code><\/td><td>ukazuje na vrch zásobníka v RAM (u nás <code>0x400<\/code>)<\/td><\/tr>\n<tr><td><code>R2 = SR<\/code><\/td><td>stavový register (príznaky + režimy spánku)<\/td><\/tr>\n<tr><td><code>R3<\/code><\/td><td>generátor konštánt (zoznam najčastejších konštánt, skracuje kód)<\/td><\/tr>\n<tr><td><code>R4 – R15<\/code><\/td><td>pracovné registre na všetko<\/td><\/tr>\n<\/table><\/div>\n<p><b class=\"t\">Zásobník (SP)<\/b>: odkladáš doň hodnoty a vyberáš ich v opačnom poradí (stoh tanierov). Rastie smerom dole, takže pri uložení hodnoty SP <b>klesne o 2<\/b>. Používa ho <code>PUSH<\/code>/<code>POP<\/code> a CPU doň samo ukladá návratovú adresu (PC) a SR, keď volá podprogram alebo prerušenie.<\/p>\n<p><b class=\"t\">Stavový register (SR)<\/b>: bity <code>V N Z C<\/code> hovoria o výsledku poslednej operácie (pretečenie, záporný, nula, prenos). <code>GIE<\/code> povoľuje prerušenia. <code>CPUOFF, OSCOFF, SCG0, SCG1<\/code> nastavujú nízkopríkonový režim (spánok).<\/p>\n\n<h3>Adresovacie režimy<\/h3>\n<p>Adresovací režim = <i>ako inštrukcia nájde svoj operand<\/i>. Tri základné:<\/p>\n<div class=\"tw\"><table>\n<tr><th>Režim<\/th><th>Zápis<\/th><th>Čo to znamená<\/th><\/tr>\n<tr><td>Registrový<\/td><td><code>Rn<\/code><\/td><td>operand je <b>priamo v registri<\/b>. Najkratšia a najrýchlejšia inštrukcia<\/td><\/tr>\n<tr><td>Nepriamy registrový<\/td><td><code>@Rn<\/code><\/td><td>v registri je <b>adresa<\/b> operandu, operand je až tam. Hodí sa na polia<\/td><\/tr>\n<tr><td>Absolútny<\/td><td><code>&amp;ADDR<\/code><\/td><td>adresa operandu je <b>napísaná priamo v inštrukcii<\/b><\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tl\">Ako si to zapamätať<\/span>Registrový: v škatuli je tá vec. Nepriamy registrový: v škatuli je lístok s adresou, kde tá vec leží. Absolútny: adresa je napísaná na samotnej inštrukcii.<\/div>\n\n<h3>Opkód, základná a emulovaná inštrukcia<\/h3>\n<p><b class=\"t\">Opkód<\/b> je časť prvého slova inštrukcie, ktorá určuje, aká operácia sa robí (sčítanie, porovnanie, skok...). <b class=\"t\">Základná inštrukcia<\/b> má vlastný opkód (je ich 27). <b class=\"t\">Emulovaná inštrukcia<\/b> vlastný opkód nemá (je ich 24), je to len pohodlnejší zápis a prekladač ju pri preklade nahradí základnou. Prípona <code>.B<\/code> = byte (8 bit), <code>.W<\/code> = word (16 bit).<\/p>\n\n<h3>Bitové manipulácie v C<\/h3>\n<p>V C nevieš zmeniť jediný bit priamo, takže použiješ <b class=\"t\">masku<\/b> a logickú operáciu, ktorá ostatné bity nechá na pokoji:<\/p>\n<div class=\"tw\"><table>\n<tr><th>Čo chceš<\/th><th>Zápis<\/th><th>Prečo to funguje<\/th><\/tr>\n<tr><td>bit do 1<\/td><td><code>REG |= BIT;<\/code><\/td><td>OR s 1 dá 1, OR s 0 nič nezmení<\/td><\/tr>\n<tr><td>bit do 0<\/td><td><code>REG &amp;= ~BIT;<\/code><\/td><td>AND s 0 dá 0, AND s 1 nič nezmení (tilda otočí masku)<\/td><\/tr>\n<\/table><\/div>\n<p>Príklad: v 8-bitovom registri <code>ABC<\/code> dať bit7 do 0, bit6 do 1, bit0 do 1, bit5 do 0:<\/p>\n<pre>ABC |= 0b01000001;   // bity 6 a 0 na 1\nABC &amp;= 0b01011111;   // bity 7 a 5 na 0<\/pre>\n<p>Pri OR dávaš jednotky tam, kde chceš zmenu. Pri AND dávaš nuly tam, kde chceš zmenu. Všade inde opačne, aby sa nič nezmenilo.<\/p>", "cards": [["Koľko a aké zbernice používa von Neumann?", "1 adresnú + 1 dátovú, zdieľané v čase (v jednom čase len inštrukcia ALEBO dáta)."], ["Koľko a aké zbernice používa Harvard a čo je výhoda?", "2 adresné + 2 dátové. Inštrukcia aj dáta sa čítajú naraz, rýchlejšie, ale zložitejšie."], ["Aká architektúra je jadro MSP430?", "von Neumann: jedna 16-bitová MAB (adresy) a jedna MDB (dáta), jeden spoločný pamäťový priestor."], ["Čo je MAB a MDB?", "Memory Address Bus a Memory Data Bus, obe 16-vodičové."], ["Kde je RAM a kde FLASH u G2553?", "RAM <code>0x0200–0x03FF<\/code>, FLASH <code>0xC000–0xFFFF<\/code> (vektory <code>0xFFC0–0xFFFF<\/code>)."], ["Čo znamená, že registre sú pamäťovo mapované?", "Majú pevnú adresu v tom istom priestore ako RAM, takže sa čítajú a zapisujú ako pamäť (napr. <code>P1OUT<\/code> = <code>0x21<\/code>)."], ["FLASH vs. RAM?", "FLASH drží obsah aj po vypnutí (program, konštanty), zápis je pomalší. RAM po vypnutí zabudne, je rýchla (dočasné dáta)."], ["Čo je RISC?", "Málo jednoduchých rýchlych inštrukcií, zložité operácie sa skladajú z viacerých. MSP430 má RISC: 27 inštrukcií, 7 adresovacích režimov."], ["Čo je CISC?", "Zložité inštrukcie, ktoré trvajú dlhšie, aj keď potrebuješ len jednoduchú operáciu."], ["Koľko registrov má CPU a ktoré sú špeciálne?", "16 × 16 bit. R0 = PC, R1 = SP, R2 = SR, R3 = generátor konštánt, R4–R15 pracovné."], ["Čo je PC (R0)?", "Adresa ďalšej inštrukcie. Inštrukcie majú 2/4/6 B, preto je adresa párna a bit 0 je vždy 0."], ["Čo je SP (R1) a čo sa deje pri uložení do zásobníka?", "Ukazuje na vrch zásobníka v RAM (<code>0x400<\/code>). Zásobník rastie dole, pri uložení SP klesne o 2."], ["Na čo CPU používa zásobník samo?", "Pri volaní podprogramu a prerušenia ukladá PC (návratová adresa) a SR."], ["Čo je v stavovom registri SR?", "<code>V N Z C<\/code> (stav ALU), <code>GIE<\/code> (povolenie prerušení), <code>CPUOFF, OSCOFF, SCG0, SCG1<\/code> (nízkopríkonové režimy)."], ["Registrový adresovací režim?", "<code>Rn<\/code>: operand je priamo v registri. Krátka a rýchla inštrukcia."], ["Nepriamy registrový režim?", "<code>@Rn<\/code>: v registri je adresa operandu (až tam je hodnota). Používa sa na polia."], ["Absolútny režim?", "<code>&amp;ADDR<\/code>: adresa operandu je priamo v inštrukcii."], ["Čo je opkód?", "Časť prvého slova inštrukcie, ktorá určuje druh operácie."], ["Základná vs. emulovaná inštrukcia?", "Základná má vlastný opkód (27). Emulovaná nie (24), je to pohodlnejší zápis a prekladač ju nahradí základnou."], ["Ako dať bit do 1 a do 0 v C?", "Do 1: <code>REG |= BIT;<\/code> Do 0: <code>REG &amp;= ~BIT;<\/code>"], ["ABC: bit7→0, bit6→1, bit0→1, bit5→0 (binárne)", "<code>ABC |= 0b01000001;<\/code> a <code>ABC &amp;= 0b01011111;<\/code>"]], "quiz": [["Aká je architektúra jadra MSP430?", ["von Neumann (jeden pamäťový priestor, jedna adresná a jedna dátová zbernica)", "Harvard (dva oddelené pamäťové priestory)", "Oboje súčasne podľa režimu", "Ani jedna, je to vlastná architektúra bez zberníc"], "MSP430 má jednu MAB a jednu MDB, po ktorých idú postupne inštrukcie z FLASH aj dáta z RAM. To je von Neumann."], ["Kde sa nachádza RAM v procesore G2553?", ["<code>0x0200 – 0x03FF<\/code>", "<code>0xC000 – 0xFFFF<\/code>", "<code>0x0010 – 0x00FF<\/code>", "<code>0xFFC0 – 0xFFFF<\/code>"], "RAM je od 0x0200 do 0x03FF. 0xC000+ je FLASH s programom, 0x0010–0x00FF sú registre periférií a úplný koniec sú vektory prerušení."], ["Prečo je bit 0 v registri PC vždy 0?", ["Inštrukcie zaberajú 2, 4 alebo 6 bajtov, takže ich adresa je vždy párna", "Bit 0 je vyhradený pre GIE", "FLASH má len párne bunky", "PC je 15-bitový register"], "Pretože každá inštrukcia má párny počet bajtov, adresa ďalšej je párna a najnižší bit je vždy nula."], ["Čo sa stane so SP, keď niečo uložíme do zásobníka?", ["Klesne o 2", "Vzrastie o 2", "Zostane rovnaký, mení sa PC", "Vynuluje sa"], "Zásobník rastie smerom dole k nižším adresám, takže pri uložení (slovo = 2 B) SP klesne o 2."], ["Čo znamená inštrukcia s operandom <code>@R5<\/code>?", ["Nepriamy registrový režim: v R5 je adresa operandu", "Registrový režim: operand je priamo v R5", "Absolútny režim: adresa je v inštrukcii", "Okamžitá konštanta 5"], "@Rn = register obsahuje adresu a operand je až na tej adrese. Operand priamo v registri by bol len Rn."], ["Ktorý príkaz v C nastaví bity 3 a 0 registra ABC na 1 a ostatné nechá?", ["<code>ABC |= 0b00001001;<\/code>", "<code>ABC &amp;= 0b00001001;<\/code>", "<code>ABC &amp;= ~0b00001001;<\/code>", "<code>ABC = 0b00001001;<\/code>"], "OR s maskou nastaví bity do 1 a ostatné nechá. AND s maskou by vynuloval všetko mimo masky, priradenie by prepísalo celý register."], ["Čo je emulovaná inštrukcia?", ["Pohodlnejší zápis bez vlastného opkódu, prekladač ju nahradí základnou", "Inštrukcia, ktorá beží len v simulátore", "Inštrukcia pre prácu s RAM", "Inštrukcia, ktorá spúšťa prerušenie"], "Základných inštrukcií je 27 s vlastným opkódom. Emulovaných je 24 a pri preklade sa premenia na základné."], ["Do R2 CPU ukladá…", ["stavový register SR (V, N, Z, C, GIE, bity spánku)", "adresu ďalšej inštrukcie", "ukazovateľ na zásobník", "konštanty z generátora"], "R0 je PC, R1 je SP, R2 je SR, R3 je generátor konštánt."]]}, {"id": "t2", "n": 2, "short": "Piny a hodiny", "kicker": "Prednáška 2", "title": "I/O piny, externé prerušenie a hodinový systém", "lead": "Ako sa riadi pin (LED, tlačidlo), ako vznikne externé prerušenie a odkiaľ procesor berie hodinový signál.", "explain": "<h3>Port a jeho registre<\/h3>\n<p>Piny sú zoskupené do <b class=\"t\">portov<\/b> po 8 (P1.0 až P1.7, P2...). Každý port má registre a <b>každý bit registra riadi jeden pin<\/b>. Je to ako ovládací panel s 8 spínačmi na každý register.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Register<\/th><th>Čo robí<\/th><\/tr>\n<tr><td><code>P1DIR<\/code><\/td><td>smer: <b>1 = výstup<\/b>, 0 = vstup. Po resete sú všetky piny vstupy<\/td><\/tr>\n<tr><td><code>P1OUT<\/code><\/td><td>čo pin vysiela: 1 = H (≈3,3 V), 0 = L. Pamätá si hodnotu. Pri vstupe so zapnutým rezistorom určuje: 1 = pull-up, 0 = pull-down<\/td><\/tr>\n<tr><td><code>P1IN<\/code><\/td><td>čo je naozaj na pine práve teraz (len na čítanie)<\/td><\/tr>\n<tr><td><code>P1REN<\/code><\/td><td>zapne vnútorný pull-up/pull-down rezistor<\/td><\/tr>\n<tr><td><code>P1SEL, P1SEL2<\/code><\/td><td>alternatívna funkcia pinu (00 = bežný I/O pin)<\/td><\/tr>\n<tr><td><code>P1IES, P1IE, P1IFG<\/code><\/td><td>externé prerušenie (hrana, povolenie, príznak)<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tl\">Ako si to zapamätať<\/span>DIR = <i>kam<\/i> idú dáta (1 von). OUT = čo <i>pošlem<\/i>. IN = čo <i>vidím<\/i>.<\/div>\n\n<h3>LED a tlačidlo<\/h3>\n<p><b class=\"t\">LED<\/b>: pin nastavíš ako výstup (<code>P1DIR<\/code>) a do <code>P1OUT<\/code> dáš 1, LED svieti (cez rezistor, nikdy nie priamo). <b>Tlačidlo<\/b>: pin musí byť vstup. Ak by bol výstup, hrozí zničenie pinu.<\/p>\n<p>Prečo pull-up? Nezapojený vstup „pláva“, číta raz 0 a raz 1 podľa rušenia. Tlačidlo pri stlačení spojí pin so zemou, ale keď je uvoľnené, pin visí vo vzduchu. <b class=\"t\">Pull-up rezistor<\/b> ho jemne pritiahne k Vcc, takže je pokoj = 1 a stlačenie = 0. Pull-down robí opak (pritiahne k zemi).<\/p>\n<pre>P1DIR &amp;= ~BIT3;   // vstup\nP1REN |=  BIT3;   // zapni rezistor\nP1OUT |=  BIT3;   // 1 = pull-up<\/pre>\n\n<h3>Alternatívne funkcie pinov<\/h3>\n<p>Pin má viac „povolaní“. Okrem bežného I/O môže byť vývod periférie (časovač, A/D prevodník, SPI...). <b class=\"t\">P1SEL a P1SEL2<\/b> ho z bežného I/O prepnú na perifériu. Pri alternatívnej funkcii nefunguje <b>externé prerušenie<\/b> toho pinu a pin nie je ovládaný ako obyčajný I/O (periféria ho preberie). Niektoré periférie navyše chcú správne nastavený aj <code>P1DIR<\/code>.<\/p>\n\n<h3>Externé prerušenie<\/h3>\n<p><b class=\"t\">Externé prerušenie<\/b> vznikne, keď sa niečo zmení na pine <i>mimo čipu<\/i> (napr. stlačíš tlačidlo). Spustí ho <b>zmena (hrana)<\/b>, nie dlhá úroveň. Použiť môžeš ktorýkoľvek pin portu P1 a P2.<\/p>\n<ul>\n<li><code>P1IES<\/code>: ktorá hrana ho spustí. 1 = zostupná (1→0), 0 = nábežná (0→1). Tlačidlo s pull-up = zostupná.<\/li>\n<li><code>P1IE<\/code>: povolí prerušenie pre daný pin (1 = povolené).<\/li>\n<li><code>P1IFG<\/code>: príznak, nastaví sa pri hrane. <b>Maže sa softvérovo<\/b> (v ISR: <code>P1IFG &amp;= ~BIT3;<\/code>).<\/li>\n<li>Plus globálne povolenie <code>GIE<\/code> v SR.<\/li>\n<\/ul>\n\n<h3>Nepoužité piny<\/h3>\n<p>Nastav ich ako <b>výstupy<\/b> a nechaj <b>nezapojené<\/b> (hodnota v P1OUT je jedno). Alebo vstup so zapnutým rezistorom. Dôvod: plávajúci vstup, ktorého napätie sa potuluje okolo polovice Vcc, zbytočne žerie prúd.<\/p>\n\n<h3>Hodinový systém: oscilátory a hodinové signály<\/h3>\n<p>Dve vrstvy. <b class=\"t\">Oscilátory<\/b> sú zdroje rytmu a <b class=\"t\">hodinové signály<\/b> sú rozvody, ktoré ten rytmus dostanú CPU a perifériám. Ku každému rozvodu si vyberieš zdroj.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Oscilátor<\/th><th>Vlastnosti<\/th><\/tr>\n<tr><td><code>LFXT1CLK<\/code><\/td><td>potrebuje externý kryštál (typ. 32 768 Hz). Presný a stabilný, ale pomalý rozbeh<\/td><\/tr>\n<tr><td><code>DCOCLK<\/code><\/td><td>interný digitálne riadený, nastaviteľný asi 100 kHz až 20 MHz, rýchly rozbeh. 1 MHz je kalibrovaný<\/td><\/tr>\n<tr><td><code>VLOCLK<\/code><\/td><td>interný, veľmi nízka spotreba, asi 12 kHz, veľký rozptyl (až ±4 kHz), nepresný<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<tr><th>Hodinový signál<\/th><th>Zdroj<\/th><th>Kto ho používa<\/th><\/tr>\n<tr><td><code>ACLK<\/code><\/td><td>LFXT1 alebo VLO (nie DCO)<\/td><td>periférie<\/td><\/tr>\n<tr><td><code>MCLK<\/code><\/td><td>LFXT1, VLO alebo DCO<\/td><td><b>iba CPU<\/b><\/td><\/tr>\n<tr><td><code>SMCLK<\/code><\/td><td>LFXT1, VLO alebo DCO<\/td><td>periférie<\/td><\/tr>\n<\/table><\/div>\n<p>Každý z troch sa dá deliť <b>1, 2, 4 alebo 8<\/b>. Čím vyššia frekvencia, tým vyššia spotreba.<\/p>\n<p><b class=\"t\">Po resete (PUC)<\/b>: MCLK a SMCLK idú z <b>DCO na ~1 MHz<\/b> (RSEL = 7, DCO = 3), ACLK ide z LFXT1.<\/p>\n<p><b class=\"t\">Kalibrácia DCO<\/b>: výrobca uložil presné nastavenia do informačnej FLASH (segment A). Skopíruješ ich do registrov a máš frekvenciu s presnosťou asi 3 %:<\/p>\n<pre>BCSCTL1 = CALBC1_1MHZ;\nDCOCTL  = CALDCO_1MHZ;<\/pre>\n<p><b class=\"t\">Prepnutie MCLK na kryštál LFXT1<\/b> (cvičenie 3): kryštál sa rozbieha dlho, preto: 1) zapni LFXT1, 2) zmaž príznak <code>OFIFG<\/code> (porucha oscilátora), 3) počkaj aspoň 50 µs, 4) ak je <code>OFIFG<\/code> znova 1, opakuj od bodu 1, 5) keď je 0, prepni zdroj MCLK. Pri prepnutí na VLO sa LFXT1 sám vypne a OFIFG sa nastaví a po návrate sa sám nezmaže, preto ho treba ošetriť znova.<\/p>\n<p>Registre: <code>DCOCTL<\/code> (DCOx, MODx), <code>BCSCTL1<\/code> (RSELx, DIVAx), <code>BCSCTL2<\/code> (SELMx, DIVMx, SELS, DIVSx), <code>BCSCTL3<\/code> (voľba LFXT1/VLO, príznaky porúch).<\/p>", "cards": [["Čo robí <code>P1DIR<\/code>?", "Nastavuje smer pinu: 1 = výstup, 0 = vstup. Po resete sú všetky piny vstupy."], ["Čo robí <code>P1OUT<\/code>?", "Určuje úroveň na výstupnom pine (1 = H, 0 = L) a pamätá si ju. Pri zapnutom rezistore: 1 = pull-up, 0 = pull-down."], ["Čo robí <code>P1IN<\/code>?", "Obsahuje aktuálne logické úrovne na pinoch, len na čítanie."], ["Čo robí <code>P1REN<\/code>?", "Zapína vnútorný pull-up/pull-down rezistor (ktorý, určuje bit v <code>P1OUT<\/code>)."], ["Prečo pull-up pri tlačidle?", "Aby nestlačené tlačidlo nenechalo pin „plávať“. Pull-up dá pokoj = 1, stlačenie = 0."], ["Čo je plávajúci vstup?", "Vstupný pin, na ktorý nič nie je pripojené. Napätie na ňom kolíše, číta sa náhodne a zbytočne žerie prúd."], ["Čo musí platiť pre pin s tlačidlom?", "Musí byť nastavený ako vstup (<code>P1DIR<\/code> bit = 0), inak hrozí zničenie pinu."], ["Ako rozsvietim LED na pine?", "Pin ako výstup (<code>P1DIR<\/code>) a do <code>P1OUT<\/code> zapíšem 1 (LED cez rezistor)."], ["K čomu sú <code>P1SEL<\/code> a <code>P1SEL2<\/code>?", "Prepínajú pin z bežného I/O (00) na alternatívnu funkciu (vývod periférie: časovač, A/D, SPI...)."], ["Čo je pri alternatívnej funkcii pinu neaktívne?", "Externé prerušenie daného pinu je zakázané a pin neriadi bežný I/O, preberá ho periféria."], ["Čo je externé prerušenie?", "Prerušenie vyvolané udalosťou (hranou signálu) na pine mimo čipu, napr. stlačením tlačidla."], ["Ktoré piny môžu byť vstupmi externých prerušení?", "Piny portov P1 a P2 (P1.0–P1.7, P2.x)."], ["<code>P1IES<\/code>?", "Výber hrany, ktorá nastaví príznak: 1 = zostupná (1→0), 0 = nábežná (0→1)."], ["<code>P1IE<\/code>?", "Povolenie prerušenia pre jednotlivé piny (1 = povolené)."], ["<code>P1IFG<\/code>?", "Príznaky prerušenia pinov. Nastaví sa pri zvolenej hrane, maže sa softvérovo v ISR."], ["Ako nastaviť nepoužité piny a prečo?", "Ako výstupy, nezapojené (alebo vstup s rezistorom). Aby nevznikol plávajúci vstup, ktorý zbytočne žerie prúd."], ["Tri oscilátory G2553?", "LFXT1CLK (kryštál 32768 Hz, presný, pomalý štart), DCOCLK (interný 100 kHz–20 MHz, rýchly štart), VLOCLK (interný ~12 kHz, najnižšia spotreba, nepresný)."], ["Ktoré hodinové signály existujú?", "ACLK, MCLK, SMCLK."], ["ACLK: zdroj a použitie?", "LFXT1 alebo VLO (nie DCO). Delenie 1/2/4/8. Pre periférie."], ["MCLK: zdroj a použitie?", "LFXT1, VLO alebo DCO. Delenie 1/2/4/8. Používa ho len CPU."], ["SMCLK: zdroj a použitie?", "LFXT1, VLO alebo DCO. Delenie 1/2/4/8. Pre periférie."], ["Stav hodín po PUC resete?", "MCLK a SMCLK z DCO ≈ 1 MHz (RSEL = 7, DCO = 3), ACLK z LFXT1."], ["Ako kalibrovať DCOCLK?", "Skopírovať kalibračné hodnoty z informačnej FLASH (segment A) do <code>BCSCTL1<\/code> a <code>DCOCTL<\/code>: presnosť ≈ 3 %."], ["Postup prepnutia MCLK na LFXT1?", "Zapnúť LFXT1, zmazať OFIFG, počkať ≥ 50 µs, testovať OFIFG a opakovať kým je 0, potom prepnúť MCLK."]], "quiz": [["Ktorý register určuje, či je pin vstup alebo výstup?", ["<code>P1DIR<\/code>", "<code>P1OUT<\/code>", "<code>P1IN<\/code>", "<code>P1REN<\/code>"], "DIR = direction (smer). 1 = výstup, 0 = vstup."], ["Pin P1.3 má tlačidlo na zem. Čo musí byť nastavené pre vnútorný pull-up?", ["<code>P1REN<\/code> bit 3 = 1 a <code>P1OUT<\/code> bit 3 = 1", "<code>P1REN<\/code> bit 3 = 1 a <code>P1OUT<\/code> bit 3 = 0", "<code>P1DIR<\/code> bit 3 = 1 a <code>P1OUT<\/code> bit 3 = 1", "<code>P1SEL<\/code> bit 3 = 1"], "REN zapne rezistor a OUT = 1 z neho spraví pull-up. S OUT = 0 by to bol pull-down. Pin musí byť vstup (DIR = 0)."], ["Čo je tzv. plávajúci vstup?", ["Vstupný pin bez pripojenia, jeho napätie kolíše a číta sa náhodne", "Pin s výstupom, ktorý rýchlo preblikáva", "Pin s alternatívnou funkciou časovača", "Pin, ktorý je zároveň vstup aj výstup"], "Bez pull rezistora alebo pripojeného signálu pin nemá definovanú úroveň, preto číta raz 0 a raz 1."], ["Prečo sa v ISR po externom prerušení musí mazať <code>P1IFG<\/code>?", ["Port má viac príznakov a CPU ich sám nemaže, inak sa ISR spúšťa dokola", "Aby sa vypol pull-up rezistor", "Aby sa zmenila hrana v <code>P1IES<\/code>", "Aby sa nastavil GIE"], "P1 je viac-príznakové prerušenie. Nezmazaný príznak znamená, že po RETI sa ISR spustí znova."], ["Ktorý hodinový signál používa iba CPU?", ["MCLK", "ACLK", "SMCLK", "Všetky tri rovnako"], "MCLK je hlavné hodiny pre CPU. ACLK a SMCLK sa prideľujú perifériám."], ["Ktorý oscilátor sa NEDÁ použiť ako zdroj pre ACLK?", ["DCOCLK", "LFXT1CLK", "VLOCLK", "Dá sa všetky"], "ACLK môže ísť z LFXT1 alebo VLO. DCO je len pre MCLK a SMCLK."], ["Aká je konfigurácia hodín po PUC?", ["MCLK a SMCLK z DCO ≈ 1 MHz, ACLK z LFXT1", "MCLK z kryštálu 32768 Hz", "Všetky tri z VLO ≈ 12 kHz", "Hodiny sú vypnuté, kým ich nezapneme"], "Po PUC ide DCO s RSEL = 7 a DCO = 3 (≈1 MHz) do MCLK a SMCLK. CPU preto začne bežať za menej ako 2 µs."], ["Ako dosiahnem presnú frekvenciu DCO 1 MHz?", ["Skopírujem kalibračné hodnoty z informačnej FLASH do <code>BCSCTL1<\/code> a <code>DCOCTL<\/code>", "Pripojím externý kryštál 1 MHz", "Nastavím MCLK delič na 1", "Nedá sa, DCO je vždy nepresný"], "Kalibračné hodnoty (CALBC1_1MHZ, CALDCO_1MHZ) dajú presnosť asi 3 %."]]}, {"id": "t3", "n": 3, "short": "Reset a prerušenia", "kicker": "Prednáška 3", "title": "Reset, prerušenia a nízkopríkonové režimy", "lead": "Čo sa stane pri štarte procesora, ako funguje prerušenie krok za krokom a ako procesor šetrí energiu.", "explain": "<h3>Dva druhy resetu<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>POR (Power-On Reset)<\/th><th>PUC (Power-Up Clear)<\/th><\/tr>\n<tr><td>Čo je to<\/td><td>reset celého procesora ako obvodu<\/td><td>slabší reset, spúšťa sa aj z viacerých iných príčin<\/td><\/tr>\n<tr><td>Kedy vznikne<\/td><td>pripojenie napájania (BOR), nízka úroveň na pine <code>!RST/NMI<\/code>, SVS<\/td><td>všetko, čo spúšťa POR, plus pretečenie watchdogu, zlý kľúč watchdogu alebo FLASH, načítanie inštrukcie z adries periférií <code>0–0x1FF<\/code><\/td><\/tr>\n<\/table><\/div>\n<p>Základný rozdiel: <b class=\"t\">POR vždy vyvolá aj PUC, ale PUC nevyvolá POR.<\/b><\/p>\n<p><b class=\"t\">BOR (Brownout reset)<\/b> je strážca napájania. Pri zapnutí drží procesor v resete, kým napätie nie je dosť vysoké, aby logické hradlá spoľahlivo fungovali. Pri poklese napätia vyvolá reset.<\/p>\n\n<h3>Stav po resete a inicializácia<\/h3>\n<p><b>Po resete<\/b> sa samo nastaví: pin <code>!RST/NMI<\/code> je vstup resetu, všetky I/O piny sú vstupy, registre a bity periférií sú v predvolenom stave, <b>zapne sa watchdog<\/b> a do PC sa načíta adresa z <b>vektora resetu <code>0xFFFE<\/code><\/b>, odkiaľ CPU začne vykonávať program.<\/p>\n<p><b>Inicializácia v programe<\/b> (toto musíš spraviť ty): nastaviť zásobník SP (v C sa robí automaticky), zastaviť/nastaviť watchdog, nastaviť použité periférie a porty, nastaviť vektory prerušení, inicializovať premenné. Voliteľne vyhodnotiť príznaky a zistiť, čo spôsobilo reset.<\/p>\n\n<h3>Prerušenie: zvonček pri dverách<\/h3>\n<p>Varíš (hlavný program) a niekto zazvoní. Prestaneš variť, otvoríš dvere (ISR) a potom pokračuješ presne tam, kde si prestal.<\/p>\n<ul>\n<li><b class=\"t\">Prerušenie<\/b>: CPU pozastaví hlavný program, vykoná <b class=\"t\">ISR<\/b> (obslužný program) a vráti sa späť.<\/li>\n<li><b class=\"t\">Príznak (flag, IF)<\/b>: bit, ktorý hardvér nastaví na 1, keď nastala udalosť (zmena na pine, pretečenie časovača, koniec prevodu...). Je to „zvonček zazvonil“.<\/li>\n<li><b class=\"t\">Povolenie (enable, IE)<\/b>: individuálne povolenie pre daný príznak. <b>GIE<\/b> je globálne povolenie, hlavný vypínač.<\/li>\n<li><b class=\"t\">Priorita<\/b>: ktorá ISR sa vykoná prvá, ak čaká viac žiadostí naraz. Je pevne daná.<\/li>\n<li><b class=\"t\">Vektor prerušenia<\/b>: pevná adresa vo FLASH (<code>0xFFC0–0xFFFC<\/code>), na ktorej je uložená adresa prvej inštrukcie ISR.<\/li>\n<\/ul>\n<p><b>Tri typy<\/b>: systémový reset, <b>nemaskovateľné<\/b> (nezávisia od GIE: NMI, porucha oscilátora, porušenie prístupu k FLASH) a <b>maskovateľné<\/b> (potrebujú GIE).<\/p>\n<p><b class=\"t\">ISR sa spustí, keď platia všetky tri:<\/b> príznak = 1, individuálne povolenie IE = 1 a GIE = 1.<\/p>\n\n<h3>Akceptácia prerušenia (6 cyklov)<\/h3>\n<ol>\n<li>Dokončí sa práve vykonávaná inštrukcia.<\/li>\n<li><b>PC<\/b> sa uloží do zásobníka (kam sa vrátiť).<\/li>\n<li><b>SR<\/b> sa uloží do zásobníka.<\/li>\n<li>Ak čaká viac žiadostí, vyberie sa najvyššia priorita.<\/li>\n<li>Jedno-príznakový príznak sa automaticky zmaže (viac-príznakový nie).<\/li>\n<li><b>SR sa celý vynuluje<\/b>, čím skončí aj nízkopríkonový režim a GIE = 0 (ďalšie prerušenia sú zakázané).<\/li>\n<li>Obsah vektora (adresa ISR) sa načíta do PC a CPU vykonáva ISR.<\/li>\n<\/ol>\n<h3>Návrat z ISR (RETI, 5 cyklov)<\/h3>\n<ol>\n<li>Zo zásobníka sa obnoví <b>SR<\/b> (všetko ako pred ISR, vrátane GIE a režimu spánku).<\/li>\n<li>Zo zásobníka sa obnoví <b>PC<\/b> a hlavný program pokračuje tam, kde bol prerušený.<\/li>\n<\/ol>\n\n<h3>Jedno-príznakové vs. viac-príznakové prerušenie<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Jedno-príznakové<\/th><th>Viac-príznakové<\/th><\/tr>\n<tr><td>Príklad<\/td><td>časovač CCR0<\/td><td>port P1 (8 príznakov), časovač TAIFG/CCR1/CCR2<\/td><\/tr>\n<tr><td>Mazanie príznaku<\/td><td>CPU ho zmaže <b>automaticky<\/b> pri štarte ISR<\/td><td>musí ho zmazať <b>ISR softvérovo<\/b><\/td><\/tr>\n<tr><td>Prečo<\/td><td>jasné, kto prerušil<\/td><td>jedna ISR slúži viacerým príznakom a musí zistiť, ktorý ju spustil<\/td><\/tr>\n<\/table><\/div>\n<p>Ak v ISR viac-príznakového prerušenia príznak nezmažeš, hneď po <code>RETI<\/code> sa ISR spustí znova a znova a program sa zacyklí.<\/p>\n<p><b>Vektory<\/b> sú v <code>0xFFC0–0xFFFE<\/code>. V C ich vyplní prekladač (<code>#pragma vector<\/code>), v assembleri to prikazuješ prekladaču ty. Nepoužité vektory CCS vyplní adresou „pasce“ (nekonečný cyklus alebo len <code>RETI<\/code>), aby chybný kód nespôsobil ďalšie škody.<\/p>\n\n<h3>Nízkopríkonové režimy<\/h3>\n<p>Nízkopríkonový režim (LPM) = CPU <b>spí<\/b> (má odpojený hodinový signál MCLK), no je stále napájané a všetko si pamätá (registre, RAM, zásobník, LED ostanú ako boli). Procesor je v CMOS, ktorý žerie hlavne pri zmenách stavov, takže bez hodín je odber minimálny. Analógové časti (oscilátory, A/D) sa pri spánku odpoja od napájania. Režimov je <b>5<\/b> (LPM0 až LPM4) a líšia sa tým, <b>ktoré oscilátory a hodiny ostanú bežať<\/b>:<\/p>\n<div class=\"tw\"><table>\n<tr><th>Režim<\/th><th>Bity v SR<\/th><th>Čo beží<\/th><\/tr>\n<tr><td>Aktívny<\/td><td>—<\/td><td>všetko<\/td><\/tr>\n<tr><td>LPM0<\/td><td><code>CPUOFF<\/code><\/td><td>CPU a MCLK spia, SMCLK a ACLK idú<\/td><\/tr>\n<tr><td>LPM1<\/td><td><code>CPUOFF + SCG0<\/code><\/td><td>navyše sa vypne DCO generátor, ak nie je zdrojom SMCLK; ACLK ide<\/td><\/tr>\n<tr><td>LPM2<\/td><td><code>CPUOFF + SCG1<\/code><\/td><td>CPU, MCLK, SMCLK, DCO spia; ACLK ide<\/td><\/tr>\n<tr><td>LPM3<\/td><td><code>CPUOFF + SCG1 + SCG0<\/code><\/td><td>ACLK ide (hodiny reálneho času), odber pod 2 µA<\/td><\/tr>\n<tr><td>LPM4<\/td><td><code>+ OSCOFF<\/code><\/td><td>spí všetko, žiadne hodiny<\/td><\/tr>\n<\/table><\/div>\n<p class=\"note\">Poznámka: na slajde 24 sú stĺpce SCG0 a SCG1 v tabuľke prehodené. Podľa výrobcu je LPM1 = SCG0 a LPM2 = SCG1. Na teste ti stačí vedieť, <i>čo beží<\/i> v ktorom režime.<\/p>\n<p><b class=\"t\">Vstup do LPM<\/b> (v hlavnom programe, po nastavení periférií a povolení prerušení):<\/p>\n<pre>__bis_SR_register(GIE + CPUOFF);   // LPM0, tu sa program zastaví<\/pre>\n<p>Prebudenie: nastane povolené prerušenie, CPU uloží PC a SR a SR vynuluje, takže sa prebudí. Po <code>RETI<\/code> sa SR obnoví a CPU <b>zaspí znova<\/b>. Ak chceš po ISR zostať hore, v ISR zmeň uloženú kópiu SR:<\/p>\n<pre>__bic_SR_register_on_exit(CPUOFF);   // po RETI ostane CPU aktívne<\/pre>\n<div class=\"tip\"><span class=\"tl\">Princíp nízkopríkonových aplikácií<\/span>Väčšinu času spať v LPM3, prebudiť sa prerušením, rýchlo všetko vybaviť a zaspať. Radšej používať periférie (časovač generuje PWM sám) než CPU.<\/div>", "cards": [["Dva druhy resetu a základný rozdiel?", "POR a PUC. POR vždy vyvolá aj PUC, ale PUC nevyvolá POR."], ["Čo vyvolá POR?", "Pripojenie napájania (BOR), nízka úroveň na pine <code>!RST/NMI<\/code>, SVS."], ["Čo okrem POR vyvolá PUC?", "Pretečenie watchdogu, zlý kľúč watchdogu alebo FLASH, inštrukcia načítaná z adries periférií (<code>0–0x1FF<\/code>)."], ["Úloha BOR?", "Deteguje nízke napájanie, drží procesor v resete, kým napätie nie je dosť vysoké, a vyvolá POR."], ["Stav po systémovom resete?", "Piny sú vstupy, registre v predvolenom stave, watchdog beží, PC ← vektor resetu <code>0xFFFE<\/code>."], ["Čo musí urobiť aplikačný softvér po resete?", "Nastaviť SP, watchdog, periférie, porty, vektory prerušení a inicializovať premenné."], ["Čo je prerušenie?", "Pozastavenie hlavného programu, CPU vykoná ISR a vráti sa späť."], ["Čo je príznak prerušenia?", "Bit (flag), ktorý sa nastaví na 1 pri hardvérovej udalosti."], ["Čo je priorita prerušenia?", "Určuje, ktorá ISR sa vykoná prvá, keď čaká viac žiadostí naraz. Je pevne daná."], ["Čo je vektor prerušenia?", "Pevná adresa vo FLASH (<code>0xFFC0–0xFFFC<\/code>), kde je uložená adresa prvej inštrukcie ISR."], ["Tri typy prerušení?", "Systémový reset, nemaskovateľné, maskovateľné."], ["Čo musí platiť, aby sa spustila ISR?", "Príznak = 1, povolenie IE = 1 a GIE = 1. (NMI nepotrebuje GIE.)"], ["Akceptácia prerušenia: čo sa uloží do zásobníka?", "PC a potom SR. Potom sa SR vynuluje (aj GIE) a do PC sa načíta vektor ISR."], ["Prečo sa pri akceptácii nuluje SR?", "Skončí nízkopríkonový režim a GIE = 0, takže ďalšie prerušenia sú zakázané."], ["Návrat z ISR (RETI)?", "Zo zásobníka sa obnoví SR a potom PC, program pokračuje tam, kde bol prerušený."], ["Jedno-príznakové vs. viac-príznakové ISR?", "Jedno: príznak maže CPU automaticky. Viac: musí ho zmazať ISR softvérovo, aby vedela, ktorý príznak ju spustil."], ["Čo sa stane, ak v ISR nezmažeš príznak viac-príznakového prerušenia?", "Po RETI sa ISR spustí znova a znova, program sa zacyklí."], ["Čo je nízkopríkonový režim?", "CPU spí (odpojený MCLK), ale je napájané. Obsah registrov a RAM ostáva. Spotreba výrazne klesá."], ["Koľko je nízkopríkonových režimov a čím sa líšia?", "5 (LPM0–LPM4). Líšia sa tým, ktoré hodiny a oscilátory ostanú aktívne (LPM0 vypne len CPU a MCLK, LPM4 všetko)."], ["Ktoré bity v SR volia režim spánku?", "<code>CPUOFF, SCG0, SCG1, OSCOFF<\/code>."], ["Ako vojdem do LPM0 v C?", "<code>__bis_SR_register(GIE + CPUOFF);<\/code>"], ["Ako zostať po ISR hore (nezaspať)?", "V ISR: <code>__bic_SR_register_on_exit(CPUOFF);<\/code> zmení uloženú kópiu SR."]], "quiz": [["Aký je základný rozdiel medzi POR a PUC?", ["POR vždy vyvolá aj PUC, ale PUC nevyvolá POR", "PUC vždy vyvolá aj POR, ale POR nevyvolá PUC", "POR je softvérový, PUC hardvérový reset", "Sú to dva názvy toho istého resetu"], "POR je silnejší reset (napájanie, reset pin). PUC vznikne z POR aj z iných príčin (watchdog, kľúč FLASH, inštrukcia z adries periférií)."], ["Kam skočí CPU po systémovom resete?", ["Na adresu uloženú vo vektore resetu <code>0xFFFE<\/code>", "Na adresu <code>0x0000<\/code>", "Na začiatok RAM <code>0x0200<\/code>", "Na adresu uloženú v SP"], "Do PC sa načíta hodnota z <code>0xFFFE<\/code>, čo je adresa prvej inštrukcie hlavného programu."], ["Ktoré tri podmienky musia byť splnené na spustenie ISR od maskovateľného prerušenia?", ["Príznak = 1, individuálne povolenie = 1, GIE = 1", "Príznak = 1, GIE = 0, CPUOFF = 1", "Príznak = 0, IE = 1, GIE = 1", "Len príznak = 1"], "Flag, IE a GIE. Nemaskovateľné prerušenia nepotrebujú GIE."], ["Čo CPU uloží do zásobníka pri akceptácii prerušenia?", ["PC a SR", "Len PC", "R4 až R15", "Nič, ukladá ISR"], "Najprv PC (návratová adresa), potom SR. Preto sa po RETI obnoví aj SR a režim spánku."], ["Prečo viac-príznakové ISR nemaže príznak CPU automaticky?", ["ISR musí zistiť, ktorý z viacerých príznakov ju spustil", "Pretože CPU to nevie", "Pretože viac-príznakové prerušenia nemajú vektor", "Aby sa ušetril čas"], "Keby CPU príznaky zmazal, ISR by už nevedela, ktorý z nich nastal. Preto ich maže programátor."], ["Čo je spoločné všetkým nízkopríkonovým režimom?", ["CPU spí (MCLK je odpojený)", "Všetky oscilátory sú vypnuté", "Stratí sa obsah RAM", "Vypne sa zásobník"], "Líšia sa tým, čo ďalšie ide, ale CPU spí vždy a obsah registrov aj RAM ostáva."], ["Čo sa stane po <code>RETI<\/code>, ak ISR nezmenila uložený SR a procesor spal v LPM0?", ["CPU znova zaspí v LPM0", "CPU ostane aktívne", "CPU prejde do LPM4", "Procesor sa resetuje"], "Zo zásobníka sa obnoví pôvodný SR vrátane CPUOFF, takže CPU sa vráti do spánku. Na ostanie hore treba <code>__bic_SR_register_on_exit(CPUOFF)<\/code>."], ["Ktorý príkaz uvedie procesor do LPM0 (s povolenými prerušeniami)?", ["<code>__bis_SR_register(GIE + CPUOFF);<\/code>", "<code>__bic_SR_register(GIE + CPUOFF);<\/code>", "<code>P1DIR |= CPUOFF;<\/code>", "<code>__enable_LPM();<\/code>"], "Nastaví bity v SR: GIE (prerušenia) a CPUOFF (spánok CPU). <code>bis<\/code> = bit set."]]}, {"id": "t4", "n": 4, "short": "Časovač", "kicker": "Prednáška 4", "title": "Časovač Timer_A a jeho aplikácie", "lead": "Čítač, ktorý beží sám bez CPU: režimy, zachytávanie a porovnávanie, výstupná jednotka (PWM) a prerušenia.", "explain": "<h3>Čo je časovač<\/h3>\n<p>Periféria sú malé jednoduché bloky, ktoré pracujú <b>súbežne s CPU<\/b>. Raz ich nastavíš a robia si svoje, CPU môže medzitým spať a periféria sa ozve <b>príznakom prerušenia<\/b>. Spotrebujú menej než CPU.<\/p>\n<p><b class=\"t\">Časovač T_A3<\/b> je 16-bitové počítadlo <code>TAR<\/code>, ktoré počíta hrany hodinového signálu, plus tri záchytné/porovnávacie registre <code>TACCR0, 1, 2<\/code> (preto „3“). G2553 má dva časovače: <code>Timer0_A3<\/code> a <code>Timer1_A3<\/code>. Vedia aj generovať PWM, merať čas a robia viac prerušení.<\/p>\n<div class=\"tip\"><span class=\"tl\">Ako si to zapamätať<\/span>TAR sú stopky, ktoré tikajú samy. TACCR sú „budíky“ alebo „fotoaparáty“ naviazané na stopky.<\/div>\n<p><b>Zdroj hodín<\/b> (bity <code>TASSEL<\/code>): <code>TACLK<\/code> (externý pin), <code>ACLK<\/code>, <code>SMCLK<\/code> alebo <code>INCLK<\/code>. <b>MCLK nie!<\/b> (je len pre CPU). <b>Delička<\/b> (bity <code>ID<\/code>): 1, 2, 4 alebo 8. Jeden tik trvá 1 / (f / delička).<\/p>\n\n<h3>Štyri režimy počítadla (bity MC)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>MC<\/th><th>Režim<\/th><th>Čo robí<\/th><\/tr>\n<tr><td>00<\/td><td>Stop<\/td><td>počítadlo stojí<\/td><\/tr>\n<tr><td>01<\/td><td><b>Up<\/b> (hore)<\/td><td>opakovane od 0 do <code>TACCR0<\/code><\/td><\/tr>\n<tr><td>10<\/td><td><b>Continuous<\/b><\/td><td>opakovane od 0 do <code>0xFFFF<\/code><\/td><\/tr>\n<tr><td>11<\/td><td><b>Up/Down<\/b><\/td><td>od 0 hore do <code>TACCR0<\/code> a potom dole späť k 0<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Up<\/b>: používame, keď chceme inú periódu než 65 536 tikov. Počet hrán v perióde je <b>TACCR0 + 1<\/b>. Pri dosiahnutí TACCR0 sa nastaví <code>TACCR0 CCIFG<\/code> a pri prechode TACCR0→0 aj <code>TAIFG<\/code>.<\/li>\n<li><b>Continuous<\/b>: pri prechode 0xFFFF→0 sa nastaví <code>TAIFG<\/code>. Vhodný na viac nezávislých časových intervalov (pozri nižšie).<\/li>\n<li><b>Up/Down<\/b>: perióda je <b>2 × TACCR0<\/b>, pre symetrické impulzy. Príznaky TACCR0 CCIFG a TAIFG sú v perióde raz, oddelené polovicou periódy.<\/li>\n<\/ul>\n<p>Príklad výpočtu: ACLK = 32 768 Hz bez delenia, Up mód, <code>TACCR0 = 32767<\/code> → perióda = 32768 tikov = <b>1 s<\/b>.<\/p>\n\n<h3>Zachytávanie (capture) vs. porovnávanie (compare)<\/h3>\n<p>Každý z blokov CCR0/1/2 je buď v jednom, alebo v druhom režime (bit <code>CAP<\/code>). Funguje s ľubovoľným režimom počítadla.<\/p>\n<ul>\n<li><b class=\"t\">Zachytávanie (CAP = 1)<\/b> je „fotka stopiek“. Keď na vstupe nastane udalosť (zvolená hrana, bity <code>CM<\/code>), <b>aktuálna hodnota TAR sa skopíruje do TACCRx<\/b> a nastaví sa príznak <code>CCIFG<\/code>. Používa sa na meranie času medzi udalosťami. Ak sa hodnota neprečíta včas a príde ďalšie zachytenie, nastaví sa bit <code>COV<\/code>.<\/li>\n<li><b class=\"t\">Porovnávanie (CAP = 0)<\/b> je „budík“. Do TACCRx zapíšeš hodnotu a komparátor stále porovnáva TAR s ňou. Pri rovnosti sa nastaví <code>EQUx<\/code>, príznak <code>CCIFG<\/code> a podľa výstupnej jednotky sa môže zmeniť výstupný pin. Používa sa na PWM a prerušenia v presných intervaloch.<\/li>\n<\/ul>\n\n<h3>Výstupná jednotka a PWM<\/h3>\n<p>Každý blok CCR má <b class=\"t\">výstupnú jednotku<\/b>, ktorá vie generovať výstupný signál (napr. PWM) <b>bez účasti CPU<\/b>. Má <b>8 režimov<\/b> (bity <code>OUTMOD<\/code> 0–7):<\/p>\n<div class=\"tw\"><table>\n<tr><th>OUTMOD<\/th><th>Režim<\/th><th>OUTMOD<\/th><th>Režim<\/th><\/tr>\n<tr><td>0<\/td><td>výstup (bit OUT)<\/td><td>4<\/td><td>toggle<\/td><\/tr>\n<tr><td>1<\/td><td>set<\/td><td>5<\/td><td>reset<\/td><\/tr>\n<tr><td>2<\/td><td>toggle/reset<\/td><td>6<\/td><td>toggle/set<\/td><\/tr>\n<tr><td>3<\/td><td>set/reset<\/td><td>7<\/td><td>reset/set<\/td><\/tr>\n<\/table><\/div>\n<p>Príklad PWM (režim 7, reset/set, časovač v Up móde): <code>TACCR0<\/code> = perióda, <code>TACCR1<\/code> = šírka impulzu. Pri rovnosti s TACCR1 sa výstup vynuluje, pri TACCR0 sa nastaví. Čím väčšie TACCR1, tým dlhšie LED svieti a tým je jasnejšia. LED stále bliká, len tak rýchlo, že oko vníma priemer. Režimy 2, 3, 6, 7 nemajú pre CCR0 zmysel (EQU0 = EQUx).<\/p>\n\n<h3>Kontinuálny režim a viac časových intervalov<\/h3>\n<p>Časovač necháš bežať dokola do 0xFFFF. V každom prerušení od komparátora len <b>posunieš cieľ o delta<\/b>: <code>TACCR0 += delta;<\/code>. 16-bitové pretečenie sa o prechod cez 0xFFFF postará samo. Interval = <b>delta / f<sub>časovača<\/sub><\/b>. Keďže CCR0 aj CCR1 majú vlastný cieľ, dostaneš <b>dve nezávislé periódy<\/b> z jedného počítadla.<\/p>\n\n<h3>Prerušenia časovača<\/h3>\n<ul>\n<li>Každý časovač má <b>dva vektory<\/b>.<\/li>\n<li>Timer0_A3: <code>0xFFF2<\/code> pre <b>CCR0<\/b> (jedno-príznakové, maže CPU) a <code>0xFFF0<\/code> pre <b>CCR1, CCR2 a TAIFG<\/b> (viac-príznakové, mažeš v ISR, register <code>TAIV<\/code>).<\/li>\n<li>Timer1_A3: <code>0xFFFA<\/code> (CCR0) a <code>0xFFF8<\/code> (CCR1, CCR2, TAIFG).<\/li>\n<li>Prerušenie vznikne, ak je príznak 1, povolené v <code>CCIE<\/code> (alebo <code>TAIE<\/code>) a <code>GIE = 1<\/code>.<\/li>\n<li>Priorita: <b>CCR0 má vyššiu prioritu než CCR1<\/b> (vyššia adresa vektora = vyššia priorita).<\/li>\n<\/ul>\n<h3>Registre<\/h3>\n<p><code>TACTL<\/code>: <code>TASSEL<\/code> (zdroj), <code>ID<\/code> (delič), <code>MC<\/code> (režim), <code>TACLR<\/code> (vynuluj), <code>TAIE<\/code>, <code>TAIFG<\/code>. <code>TACCTLx<\/code>: <code>CM, CCIS, SCS, CAP, OUTMOD, CCIE, CCI, OUT, COV, CCIFG<\/code>.<\/p>", "cards": [["Základné vlastnosti časovača T_A3?", "16-bitový čítač/časovač, 4 režimy, voliteľný zdroj hodín, 3 záchytné/porovnávacie registre, výstupy s PWM, viac prerušení."], ["Čo znamená „3“ v T_A3?", "Tri záchytné/porovnávacie registre: TACCR0, TACCR1, TACCR2."], ["Zdroje hodín pre TAR?", "<code>TACLK<\/code> (externý pin), <code>ACLK<\/code>, <code>SMCLK<\/code>, <code>INCLK<\/code>. Nie MCLK."], ["Deliace pomery deličky časovača?", "1, 2, 4 alebo 8 (bity <code>ID<\/code>)."], ["Štyri režimy počítadla (MC)?", "00 stop, 01 Up (0 → TACCR0), 10 Continuous (0 → 0xFFFF), 11 Up/Down (0 → TACCR0 → 0)."], ["Up mód: kam počíta a koľko hrán v perióde?", "Od 0 do TACCR0, potom znova od 0. Hrán v perióde: TACCR0 + 1."], ["Up/Down mód: perióda?", "2 × TACCR0 (hore do TACCR0 a dole späť k 0)."], ["Continuous mód: kam počíta a kedy TAIFG?", "Od 0 do 0xFFFF. TAIFG sa nastaví pri prechode 0xFFFF → 0."], ["Na čo je continuous mód?", "Na viac nezávislých časových intervalov: v ISR <code>TACCR0 += delta<\/code>. Interval = delta / f."], ["Režim zachytávania (CAP = 1)?", "Pri udalosti na vstupe sa hodnota TAR skopíruje do TACCRx a nastaví sa CCIFG. Na meranie času."], ["Režim porovnávania (CAP = 0)?", "Keď TAR = TACCRx, nastaví sa EQUx a CCIFG (prípadne zmena výstupu). Na PWM a prerušenia v intervaloch."], ["Úloha výstupnej jednotky?", "Generuje výstupný signál (napr. PWM) bez účasti CPU podľa EQU0 a EQUx."], ["Koľko režimov má výstupná jednotka?", "8 (OUTMOD 0–7)."], ["Ako vyrobiť PWM?", "Up mód, TACCR0 = perióda, TACCR1 = šírka, OUTMOD 7 (reset/set). Väčšie TACCR1 = dlhšie svieti."], ["Vektory prerušení Timer1_A3?", "Dva: <code>0xFFFA<\/code> (CCR0) a <code>0xFFF8<\/code> (CCR1, CCR2, TAIFG)."], ["Čo nastaví príznaky vektora CCR0 a spoločného vektora?", "CCR0: zachytenie/zhoda v CCR0. Spoločný: zachytenie/zhoda v CCR1 a CCR2 a pretečenie počítadla (TAIFG)."], ["Ktorý príznak časovača sa maže automaticky?", "TACCR0 CCIFG (jedno-príznakové). TACCR1, TACCR2 a TAIFG maže ISR."], ["Ktorý komparátor má vyššiu prioritu?", "CCR0 má vyššiu prioritu než CCR1."], ["Ako vypnem časovač pre úsporu energie?", "Bity <code>MC<\/code> = 00 (stop)."], ["Čo je bit COV?", "Pretečenie pri zachytení: zachytilo sa nové ešte pred prečítaním predošlého. Maže sa softvérovo."]], "quiz": [["Ktorý hodinový signál sa NEDÁ zvoliť ako zdroj pre počítadlo TAR?", ["MCLK", "ACLK", "SMCLK", "Externý TACLK"], "MCLK používa len CPU. Časovač berie ACLK, SMCLK alebo externý pin."], ["V ktorom móde počíta TAR opakovane od 0 do hodnoty v TACCR0?", ["Up (MC = 01)", "Continuous (MC = 10)", "Up/Down (MC = 11)", "Stop (MC = 00)"], "Up mód počíta od nuly do TACCR0 a znova. Continuous ide do 0xFFFF, Up/Down ide hore aj dole."], ["ACLK = 32 768 Hz bez delenia, Up mód. Aké TACCR0 dá periódu 1 s?", ["32767", "32768", "16384", "1000"], "V Up móde je perióda TACCR0 + 1 tikov. Chceš 32768 tikov, preto 32767."], ["Čo sa stane pri zachytení?", ["Hodnota TAR sa skopíruje do TACCRx a nastaví sa CCIFG", "TACCRx sa skopíruje do TAR", "Zmení sa výstupný pin podľa OUTMOD", "Vynuluje sa časovač"], "Zachytávací režim urobí „fotku“ čítača pri udalosti na vstupe. Porovnávací režim je opačný, hodnotu zapisuješ ty."], ["Koľko režimov má výstupná jednotka časovača T_A3?", ["8", "3", "4", "10"], "OUTMOD je 3-bitový, takže 0 až 7, čo je 8 režimov."], ["Koľko vektorov prerušení má Timer1_A3 a ako sú rozdelené?", ["Dva: jeden pre CCR0 a jeden pre CCR1, CCR2 a TAIFG", "Jeden spoločný pre všetko", "Tri, každý pre jeden CCR", "Štyri, po jednom na režim"], "Vektory 0xFFFA (CCR0) a 0xFFF8 (CCR1, CCR2, TAIFG). Timer0_A3 má 0xFFF2 a 0xFFF0."], ["Prečo sa v ISR pre CCR1 musí mazať príznak, ale v ISR pre CCR0 nie?", ["CCR0 je jedno-príznakové (maže CPU), CCR1 je viac-príznakové", "Je to naopak", "CCR1 nemá príznak", "V ISR pre CCR0 sa maže vždy"], "Jedno-príznakové prerušenie maže CPU automaticky. CCR1, CCR2 a TAIFG zdieľajú vektor, takže ich maže ISR."], ["Ako v continuous móde vyrobím interval 1 s pri f = 32768 Hz?", ["V ISR <code>TACCR0 += 32768;<\/code>", "<code>TACCR0 = 32768;<\/code> raz na začiatku", "<code>TAR = 32768;<\/code> v ISR", "Nedá sa, treba Up mód"], "Posúvaš cieľ o delta = f × t = 32768 tikov. 16-bitové pretečenie sa dopočíta samo."]]}, {"id": "t5", "n": 5, "short": "SPI a USCI", "kicker": "Prednáška 5", "title": "Sériová komunikácia, SPI a modul USCI", "lead": "Ako sa posielajú dáta bit po bite, ako funguje SPI a ako ho nastaviť na MSP430.", "explain": "<h3>Prečo sériová komunikácia<\/h3>\n<p>Namiesto 8 vodičov pošleš bajt <b>po jednom bite po jednom vodiči<\/b>. Menej drôtov, lacnejšie, ale treba pravidlá (protokol). Najvýznamnejšie zbernice: <b class=\"t\">USB, Ethernet, PCIe, SPI, I²C<\/b>, ďalej RS-232, RS-485, CAN, LIN, FireWire.<\/p>\n\n<h3>Všeobecný koncept: master / slave<\/h3>\n<ul>\n<li>Jedno zariadenie je <b>master<\/b> (nadriadený), ostatné <b>slave<\/b>.<\/li>\n<li><b>Komunikáciu začína vždy master<\/b> a <b>hodinový signál CLK generuje len master<\/b>.<\/li>\n<li>Dáta idú master → slave alebo slave → master, ale štartuje ich vždy master.<\/li>\n<li>Slave medzi sebou nekomunikujú, len cez mastera.<\/li>\n<li>Vysiela vždy len jedno zariadenie, ostatné majú dátový pin ako vstup.<\/li>\n<\/ul>\n<p>Iné typy: <b>point-to-point<\/b> (dve rovnocenné zariadenia, často asynchrónne) a <b>multi-master<\/b> (viac masterov, potrebuje arbitráž, napr. I²C).<\/p>\n\n<h3>Diferenciálny prenos<\/h3>\n<p>Signál ide po <b>dvoch vodičoch v protifáze<\/b>. Rušenie z okolia pôsobí na oba vodiče rovnako a rozdielový zosilňovač ho na vstupe odčíta. Výhody: <b>veľká odolnosť voči rušeniu<\/b> a dvojica sama neruší okolie (jej vyžarovanie sa v protifáze ruší). Používajú ho <b class=\"t\">RS-485, Ethernet (krútená dvojlinka), PCIe a USB<\/b>.<\/p>\n\n<h3>SPI<\/h3>\n<p><b class=\"t\">Serial Peripheral Interface<\/b> (od Motoroly): <b>synchrónna<\/b> (má hodiny), sériová, <b>plne duplexná<\/b> (vysiela a prijíma naraz), master/slave. Na <b>krátke vzdialenosti<\/b> (medzi obvodmi na doske): A/D a D/A prevodníky, posuvné registre, displeje. Rýchlosť až <b>niekoľko Mbps<\/b> (rýchlejšia než I²C, ktorá ide do 100 kb/s).<\/p>\n<div class=\"tw\"><table>\n<tr><th>Signál<\/th><th>Význam<\/th><\/tr>\n<tr><td><code>MOSI<\/code> (= SIMO)<\/td><td>Master Out, Slave In: dáta z mastera do slave<\/td><\/tr>\n<tr><td><code>MISO<\/code> (= SOMI)<\/td><td>Master In, Slave Out: dáta zo slave do mastera<\/td><\/tr>\n<tr><td><code>SCLK<\/code><\/td><td>hodinový signál (generuje master)<\/td><\/tr>\n<tr><td><code>/SS<\/code><\/td><td>Slave Select: výber slave a štart komunikácie<\/td><\/tr>\n<\/table><\/div>\n<p>Zapojenie: master a slave spojíš 1:1 (MOSI-MOSI, MISO-MISO, SCLK-SCLK, SS-SS). <b>Viac slave<\/b>: MOSI, MISO a SCLK sú spoločné a <b>každý slave má vlastný /SS<\/b> od mastera (preto je to hardvérovo zložitejšie ako I²C).<\/p>\n<div class=\"tip\"><span class=\"tl\">Ako si to zapamätať<\/span>Master a slave majú každý jeden 8-bitový posuvný register a sú spojené do kruhu. S každým taktom hodín master vysunie 1 bit do slave a súčasne slave vysunie 1 bit do mastera. Po 8 taktoch si bajty <b>vymenili<\/b>. Preto je to plný duplex.<\/div>\n<h3>Protokol prenosu<\/h3>\n<p>Master <b>mení dátový bit na MOSI na dobežnej hrane<\/b> CLK a slave ho <b>číta na nábežnej hrane<\/b>. Dáta sa menia a čítajú v odlišných okamihoch, takže sa nikdy nečítajú počas zmeny. Jeden bit = jedna perióda CLK. Príklad (iný než v prednáške): bity <code>0 1 1 0<\/code> sa pošlú v 4 taktoch postupne, každý bit je ustálený pri nábežnej hrane.<\/p>\n\n<h3>USCI na MSP430<\/h3>\n<p><b class=\"t\">USCI<\/b> (Universal Serial Communication Interface) je hardvér na sériovú komunikáciu. Dva moduly: <b>USCI_A<\/b> (UART, IrDA, LIN, SPI) a <b>USCI_B<\/b> (SPI, I²C). V režime SPI robia to isté. Dá sa predstaviť ako dva 8-bitové posuvné registre (vysielací a prijímací) s vyrovnávacími registrami.<\/p>\n<p><b>Vlastnosti<\/b>: 3- a 4-vodičové SPI, I²C, dáta 7 alebo 8 bitov, voľba MSB/LSB first, voliteľná polarita a fáza hodín, programovateľný zdroj hodín, slave môže byť v LPM4 (nepotrebuje vnútorné hodiny), prerušenia, automatická detekcia START/STOP a kolízie pri I²C.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Register / bit<\/th><th>Úloha<\/th><\/tr>\n<tr><td><code>UCB0TXBUF<\/code><\/td><td>sem zapíšeš dáta na vyslanie. <b>Zápis spustí vysielanie<\/b> (aj príjem, ak je USCI master)<\/td><\/tr>\n<tr><td><code>UCB0RXBUF<\/code><\/td><td>odtiaľ čítaš prijaté dáta<\/td><\/tr>\n<tr><td><code>UCB0TXIFG<\/code><\/td><td>príznak: vysielací buffer je voľný a môžeš zapísať ďalšie dáta<\/td><\/tr>\n<tr><td><code>UCB0RXIFG<\/code><\/td><td>príznak: prijatý celý znak (8 alebo 7 bitov)<\/td><\/tr>\n<tr><td><code>UCB0BR0, BR1<\/code><\/td><td>delička hodín: f<sub>CLK<\/sub> = f<sub>BRCLK<\/sub> / (BR0 + 256·BR1)<\/td><\/tr>\n<tr><td><code>UCSSELx<\/code><\/td><td>zdroj hodín USCI: ACLK alebo SMCLK<\/td><\/tr>\n<tr><td><code>UCSWRST<\/code><\/td><td>1 = modul v resete (možno ho konfigurovať), 0 = aktívny<\/td><\/tr>\n<tr><td><code>UCMST<\/code><\/td><td>1 = master, 0 = slave<\/td><\/tr>\n<tr><td><code>UCMSB<\/code><\/td><td>1 = prvý ide MSB, 0 = prvý LSB<\/td><\/tr>\n<tr><td><code>UCCKPL, UCCKPH<\/code><\/td><td>polarita (kľudová úroveň CLK) a fáza hodín<\/td><\/tr>\n<\/table><\/div>\n<p><b>Piny G2553 pre USCI_B v SPI<\/b>: <code>P1.5<\/code> = UCB0CLK, <code>P1.6<\/code> = SOMI, <code>P1.7<\/code> = SIMO (nastavené cez P1SEL a P1SEL2).<\/p>\n<p><b>Postup konfigurácie<\/b>: 1) <code>UCSWRST = 1<\/code>, 2) nastav riadiace bity (master, polarita, fáza, MSB, zdroj hodín, delička), 3) nastav piny na alternatívnu funkciu, 4) <code>UCSWRST = 0<\/code>, 5) voliteľne povoľ prerušenia (<code>UCB0RXIE<\/code>/<code>UCB0TXIE<\/code>).<\/p>\n\n<h3>Polarita a fáza (príklad 74HC595)<\/h3>\n<p>Slave obvod 74HC595 číta bity na <b>nábežnej hrane<\/b> hodín. Preto musí USCI <b>meniť dáta na dobežnej hrane<\/b>. Z 4 kombinácií sú správne dve: <b class=\"t\">CKPL = 0 a CKPH = 1<\/b>, alebo <b class=\"t\">CKPL = 1 a CKPH = 0<\/b>. Pri ostatných dvoch sa dáta menia v tom istom okamihu, keď ich slave číta, takže sú nespoľahlivé. <code>CKPL<\/code> určuje úroveň CLK, keď sa nič neprenáša (neaktívna úroveň).<\/p>", "cards": [["Štyri najvýznamnejšie sériové zbernice?", "USB, Ethernet, PCIe, SPI (alebo I²C). Ďalej RS-232, RS-485, CAN, LIN, FireWire."], ["Všeobecný koncept master/slave?", "Master začína komunikáciu a generuje CLK. Slave medzi sebou nekomunikujú. Vysiela vždy len jedno zariadenie."], ["Ktoré zbernice majú diferenciálny prenos a výhoda?", "RS-485, Ethernet, PCIe, USB. Odolnosť voči rušeniu (rušenie je na oboch vodičoch rovnaké a odčíta sa) a vlastné nerušenie okolia."], ["Čo je SPI?", "Serial Peripheral Interface: synchrónna, sériová, plne duplexná zbernica master/slave na krátke vzdialenosti."], ["Použitie a rýchlosť SPI?", "A/D a D/A prevodníky, posuvné registre, displeje. Až niekoľko Mbps (rýchlejšia ako I²C)."], ["Signály SPI?", "MOSI (SIMO), MISO (SOMI), SCLK, /SS."], ["MOSI a MISO?", "MOSI: Master Out Slave In (dáta z mastera). MISO: Master In Slave Out (dáta zo slave)."], ["Ako pripojím viac slave k SPI masteru?", "MOSI, MISO a SCLK spoločné, každý slave má vlastný /SS od mastera."], ["Prečo je SPI plný duplex?", "Dva posuvné registre (master a slave) v kruhu: každým taktom sa vymení 1 bit oboma smermi."], ["Protokol SPI: kedy sa dáta menia a kedy čítajú?", "Master mení bit na MOSI na dobežnej hrane CLK, slave číta na nábežnej hrane."], ["Čo je USCI?", "Universal Serial Communication Interface: hardver na sériovú komunikáciu (USCI_A: UART, IrDA, LIN, SPI; USCI_B: SPI, I²C)."], ["Vlastnosti USCI?", "3/4-vodičové SPI, I²C, 7/8 bit, MSB/LSB first, polarita a fáza hodín, programovateľný zdroj hodín, prerušenia, slave môže byť v LPM4."], ["Čo spustí vysielanie pri SPI masteri?", "Zápis dát do <code>UCB0TXBUF<\/code>: skopírujú sa do posuvného registra a spustia sa hodiny. Súčasne sa prijíma."], ["<code>UCB0TXIFG<\/code> a <code>UCB0RXIFG<\/code>?", "TXIFG: vysielací buffer je voľný. RXIFG: prijatý celý znak, dá sa prečítať z <code>UCB0RXBUF<\/code>."], ["Delička hodín USCI?", "<code>UCB0BR0 + 256·UCB0BR1<\/code>, hodiny z ACLK alebo SMCLK (<code>UCSSEL<\/code>)."], ["Postup konfigurácie USCI?", "UCSWRST = 1, nastaviť riadiace bity, nastaviť piny na alt. funkciu, UCSWRST = 0, voliteľne povoliť prerušenia."], ["Piny USCI_B SPI na G2553?", "<code>P1.5<\/code> UCB0CLK, <code>P1.6<\/code> SOMI, <code>P1.7<\/code> SIMO."], ["Čo určujú <code>UCCKPL<\/code> a <code>UCCKPH<\/code>?", "Polaritu (kľudovú úroveň CLK) a fázu (kedy sa dáta menia a čítajú voči hrane CLK)."], ["Správne CKPL/CKPH pre 74HC595 (číta na nábežnej)?", "CKPL = 0 a CKPH = 1, alebo CKPL = 1 a CKPH = 0: dáta sa menia na dobežnej hrane."]], "quiz": [["Ktoré zbernice používajú diferenciálny prenos signálu?", ["RS-485, Ethernet, PCIe, USB", "SPI, I²C, UART", "SPI, RS-232, CAN", "Žiadna zo sériových zberníc"], "Dvojica vodičov v protifáze robí zbernicu odolnú voči rušeniu. SPI a I²C sú jednoduché jednovodičové signály."], ["Čo platí o SPI?", ["Je synchrónna a plne duplexná", "Je asynchrónna a poloduplexná", "Používa len jeden dátový vodič", "Hodinový signál generuje slave"], "SPI má hodiny (synchrónna) a dva dátové vodiče MOSI/MISO, takže ide plný duplex. Hodiny generuje vždy master."], ["Ktorý signál SPI určuje, s ktorým slave komunikuje master?", ["/SS (Slave Select)", "MOSI", "MISO", "SCLK"], "Každý slave má vlastný /SS. Ten zároveň určuje začiatok komunikácie."], ["Čo spustí vysielanie, ak je USCI master?", ["Zápis do <code>UCB0TXBUF<\/code>", "Zápis do <code>UCB0RXBUF<\/code>", "Nastavenie <code>UCB0RXIFG<\/code>", "Zmena <code>UCCKPL<\/code>"], "Zápis do TXBUF skopíruje dáta do posuvného registra a spustí generátor hodín."], ["Kedy master pri SPI mení bit na MOSI a kedy ho slave číta?", ["Master mení na dobežnej hrane, slave číta na nábežnej", "Obaja na nábežnej hrane", "Master číta, slave mení na dobežnej hrane", "Dáta sa menia aj čítajú na úrovni, nie na hrane"], "Aby sa bit nečítal v okamihu zmeny, striedajú sa hrany. Presné hrany sa nastavujú cez CKPL a CKPH."], ["Obvod 74HC595 číta dáta na nábežnej hrane SCLK. Ktoré nastavenie je správne?", ["CKPL = 0 a CKPH = 1 (alebo CKPL = 1 a CKPH = 0)", "CKPL = 0 a CKPH = 0", "CKPL = 1 a CKPH = 1", "Hocijaké, na nastavení nezáleží"], "USCI musí meniť dáta na dobežnej hrane. Pri 00 a 11 sa menia na nábežnej, v tom istom okamihu, keď ich 595 číta."], ["Ktoré piny G2553 používa USCI_B v SPI?", ["<code>P1.5<\/code> (CLK), <code>P1.6<\/code> (SOMI), <code>P1.7<\/code> (SIMO)", "<code>P1.0<\/code>, <code>P1.1<\/code>, <code>P1.2<\/code>", "<code>P2.0<\/code>, <code>P2.1<\/code>, <code>P2.2<\/code>", "<code>P1.3<\/code>, <code>P1.4<\/code>, <code>P1.5<\/code>"], "Cez P1SEL a P1SEL2 sa na P1.5, P1.6 a P1.7 pripoja signály USCI_B."], ["Prečo sa pri konfigurácii USCI najprv nastaví <code>UCSWRST = 1<\/code>?", ["Aby sa dali bezpečne meniť nastavenia bez náhodného vyslania bitu", "Aby sa spustilo vysielanie", "Aby sa zapol pull-up", "Aby sa vymazal TXBUF"], "V resete modul nič nevysiela ani neprijíma. Až po nastavení všetkého sa zrušením UCSWRST aktivuje."]]}, {"id": "t6", "n": 6, "short": "Cvičenia 1–5", "kicker": "Cvičenia 1 až 5", "title": "Otázky z cvičení", "lead": "Čo sme robili na cvičeniach a čo z toho z nich vyplýva. Konkrétne hodnoty z tvojho kódu si over, tu sú princípy.", "explain": "<p class=\"note\">Zdrojové kódy zo cvičení (okrem zadaní) nemám, takže tu je to, čo vyplýva zo zadaní a z prednášok. Odpovede, ktoré sa týkajú tvojho konkrétneho kódu alebo dosky (farba LED, výsledky z breakpointov), si over.<\/p>\n\n<h3>Cvičenie 1: assembler a blikač<\/h3>\n<p>Blikač v assembleri je nekonečná slučka: <b>prepni LED<\/b> (XOR na <code>P1OUT<\/code>), potom <b>odpočítavaj R15 do nuly<\/b> ako oneskorenie, potom <code>jmp Mainloop<\/code>. LED D1 a D2 sú pripojené na <code>P1.0<\/code> a <code>P1.6<\/code> (farby si over v schéme dosky).<\/p>\n<ul>\n<li><b>Striedavé blikanie<\/b>: na začiatku nastav jednu LED na 1 a druhú na 0, a potom prepínaj obe naraz (XOR oboch bitov). Vždy bude jedna svietiť a druhá nie.<\/li>\n<li><b>2× rýchlejšie<\/b>: polovičná konštanta v R15. <b>2× pomalšie<\/b>: dvojnásobná. Problém: R15 je 16-bitový, najväčšia hodnota je 65 535, takže na dvojnásobok treba pridať druhú (vnorenú) slučku.<\/li>\n<li><b>.text a .reset<\/b> v linkeri: <code>.text<\/code> (program) ide od <code>0xC000<\/code>, <code>.reset<\/code> je vektor resetu na <code>0xFFFE<\/code>. Program začína na <code>0xC000<\/code> a na <code>0xFFFE<\/code> je uložená táto adresa (to je to, čo si CPU prečíta po resete).<\/li>\n<\/ul>\n\n<h3>Cvičenie 2: C vs. assembler, tlačidlo<\/h3>\n<p>Prekladač C premení na assembler. V Disassembly vidíš, že prvá inštrukcia po resete je na adrese z vektora resetu a program (<code>main<\/code>) začína na <code>0xC000<\/code>.<\/p>\n<p><b>Tlačidlo S1<\/b> (pin <code>P1.3<\/code>) so zapnutým pull-up: nestlačené = 1, stlačené = 0. Technika <b class=\"t\">vymaskovania bitu<\/b>: <code>while (P1IN &amp; BIT3)<\/code> čaká, kým je tlačidlo nestlačené, lebo maska <code>BIT3<\/code> z celého <code>P1IN<\/code> vyberie len bit 3.<\/p>\n<p><b>Prečo LED len krátko bliknú<\/b>: zapnutá optimalizácia prekladača. Prázdny oneskorovací cyklus je pre prekladač „zbytočný“ kód, a tak ho vyhodí alebo skráti, takže delay nič nerobí. Oprava: premennú v cykle označiť <code>volatile<\/code>, aby ju prekladač nemohol vyhodiť (vypnúť optimalizáciu je možné, ale nevhodné).<\/p>\n\n<h3>Cvičenie 3: hodinový systém<\/h3>\n<ul>\n<li>Z bitov v <code>BCSCTL2<\/code> a <code>BCSCTL3<\/code> zistíš, ktorý oscilátor napája MCLK. Po resete je to <b>DCO ≈ 1 MHz<\/b>.<\/li>\n<li><b>Polovičná frekvencia MCLK<\/b> (delička DIVM): CPU je 2× pomalšie, takže ten istý cyklus trvá 2× dlhšie a LED blikajú <b>2× pomalšie<\/b>. Oprava: oneskorenie zmenšiť na polovicu.<\/li>\n<li><b>LFXT1 (32 768 Hz)<\/b> je asi 30× pomalší než 1 MHz, takže LED blikajú asi 30× pomalšie. <b>VLO (≈12 kHz)<\/b> asi 80× pomalšie. Konštantu oneskorenia treba zmenšiť v rovnakom pomere (nová = stará × f<sub>nová<\/sub> / f<sub>stará<\/sub>).<\/li>\n<li><b>Príznak OFIFG<\/b>: pri prepnutí na VLO sa LFXT1 vypne a OFIFG sa nastaví. Po návrate na LFXT1 ostane nastavený, kým ho nezmažeš. Preto pri viacnásobnom behu slučky treba pred prepnutím na LFXT1 vždy zopakovať postup: zmazať OFIFG, počkať 50 µs, testovať, až kým je 0.<\/li>\n<\/ul>\n\n<h3>Cvičenie 4: externé prerušenie a nízky príkon<\/h3>\n<ul>\n<li>Tlačidlo S1 cez <code>P1IES<\/code> (zostupná hrana), <code>P1IE<\/code>, <code>P1IFG<\/code>, <code>GIE<\/code>. V ISR sa maže príznak.<\/li>\n<li><b>Mazanie príznaku<\/b>: ak sa príznak maže na začiatku ISR, stlačenie počas blikania ho znova nastaví a ISR sa po návrate spustí ešte raz. Ak ho presunieš až na koniec, stlačenia počas blikania sa ignorujú, takže LED zablikajú vždy len 16×.<\/li>\n<li><b>Meranie prúdu<\/b>: v aktívnom režime (bežiaci program aj ISR) je odber rádovo stovky µA. Po uvedení do <b>LPM4<\/b> (hlavný program skončí v spánku, ISR ho prebúdza) odber v spánku klesne na minimum, rádovo µA a menej. Pri ISR je odber opäť ako v aktívnom režime.<\/li>\n<li><b>Tlačidlá a enkodér<\/b>: SW2 na <code>P1.1<\/code> a SW3 na <code>P1.2<\/code>, v ISR zistíš, ktorý príznak v <code>P1IFG<\/code> je nastavený, a príslušnú LED prepneš (XOR) a príznak zmažeš.<\/li>\n<li><b>Enkodér<\/b> má dva výstupy A a B posunuté o štvrť periódy. Pri hrane na A sa pozrieš na úroveň B: podľa toho, či je 1 alebo 0, otáča sa doprava alebo doľava. Doprava prepínaš zelenú, doľava červenú LED.<\/li>\n<\/ul>\n\n<h3>Cvičenie 5: časovač<\/h3>\n<ul>\n<li>Časovač v <b>continuous móde<\/b> a v ISR <code>TACCR0 += delta<\/code>. Po pauze je program v ISR, lebo tá trvá najdlhšie.<\/li>\n<li>Po pripojení <b>SMCLK<\/b> na vstup TAR a zmene zdroja na <b>LFXT1 (32 768 Hz)<\/b> sa mení frekvencia blikania, lebo sa mení frekvencia, ktorú TAR počíta.<\/li>\n<li><b>Výpočet delta<\/b>: delta = f<sub>časovača<\/sub> × čas. Zelená LED s periódou 2 s (1 s svieti) = prepnúť každú 1 s: pri 32 768 Hz je <code>delta = 32768<\/code>. Červená s periódou 1 s (0,5 s svieti) = prepnúť každých 0,5 s: <code>delta = 16384<\/code>.<\/li>\n<li><b>Prečo červená trvale svieti slabšie<\/b>: ISR od CCR1 je viac-príznakové a nezmazaný príznak sa spúšťa stále dokola, takže LED sa prepína veľmi rýchlo a oko vidí slabé svietenie. Program je pri pauze v tejto ISR. Doplníš zmazanie príznaku. Zelená stále správne bliká, lebo CCR0 má <b>vyššiu prioritu<\/b> než CCR1.<\/li>\n<li><b>ISR portu P1<\/b> pre tlačidlá: každé stlačenie zapne alebo vypne blikanie príslušnej LED (prepínaš pomocnú premennú) a pri vypnutom blikaní LED aj zhasne.<\/li>\n<\/ul>", "cards": [["Ako blikač v assembleri funguje?", "Nekonečná slučka: prepne LED (XOR <code>P1OUT<\/code>), odpočíta R15 do 0 ako oneskorenie, <code>jmp Mainloop<\/code>."], ["Ako urobiť, aby LED blikali striedavo?", "Jednu na začiatku nastaviť na 1, druhú na 0 a potom prepínať obe naraz (XOR oboch bitov)."], ["Ako urobiť blikanie 2× rýchlejšie a 2× pomalšie?", "Rýchlejšie: polovičná konštanta v R15. Pomalšie: dvojnásobná, ale R15 je 16-bitový (max 65 535), treba vnorenú slučku."], ["Na akú adresu odkazuje <code>.text<\/code> a <code>.reset<\/code>?", "<code>.text<\/code> (program) na <code>0xC000<\/code> (začiatok FLASH), <code>.reset<\/code> na <code>0xFFFE<\/code> (vektor resetu)."], ["Čo je na adrese <code>0xFFFE<\/code> a ako súvisí s <code>.text<\/code>?", "Adresa prvej inštrukcie programu (<code>0xC000<\/code>). CPU si ju po resete načíta do PC."], ["Čo je vymaskovanie bitu v <code>while (P1IN &amp; BIT3)<\/code>?", "AND s maskou vyberie z <code>P1IN<\/code> len bit 3. Podmienka platí, kým je tlačidlo nestlačené (pull-up = 1)."], ["Prečo LED len krátko bliknú po niekoľkých stlačeniach (cv2)?", "Optimalizácia prekladača vyhodila/skrátila prázdny oneskorovací cyklus. Oprava: premenná v cykle <code>volatile<\/code>."], ["Čo sa stane pri polovičnej frekvencii MCLK?", "CPU je 2× pomalšie, LED blikajú 2× pomalšie. Oprava: polovičné oneskorenie."], ["Ako rýchlo blikajú LED pri LFXT1 a VLO oproti DCO 1 MHz?", "LFXT1 (32768 Hz) asi 30× pomalšie, VLO (≈12 kHz) asi 80× pomalšie. Oneskorenie treba zmenšiť v rovnakom pomere."], ["Prečo treba pri viacnásobnom behu slučky (cv3) ošetriť OFIFG?", "Pri prepnutí na VLO sa LFXT1 vypne a OFIFG sa nastaví a sám sa nezmaže. Treba ho znova zmazať a počkať, kým ostane 0."], ["Ako urobiť, aby LED zablikali po stlačení S1 vždy 16×? (cv4)", "Presunúť mazanie príznaku <code>P1IFG<\/code> na koniec ISR, aby sa stlačenia počas blikania ignorovali."], ["Ako sa zmenila spotreba po LPM4 (cv4)?", "V spánku klesla na minimum (rádovo µA a menej). V ISR je odber ako v aktívnom režime."], ["Ako zistím, či bolo stlačené zelené alebo červené tlačidlo?", "V ISR testujem, ktorý bit v <code>P1IFG<\/code> je nastavený (P1.1 zelené, P1.2 červené), prepnem príslušnú LED a príznak zmažem."], ["Princíp enkodéra?", "Dva výstupy A, B posunuté o štvrť periódy. Pri hrane na A sa podľa úrovne B určí smer otáčania."], ["Ako vypočítam <code>delta<\/code> pre časovač (cv5)?", "delta = f<sub>časovača<\/sub> × čas. Pri 32768 Hz: 1 s = 32768, 0,5 s = 16384."], ["Prečo červená LED v cv5 svieti trvale slabšie?", "Nezmazaný príznak CCR1 (viac-príznakové): ISR sa spúšťa stále dokola, LED sa prepína veľmi rýchlo. Treba v ISR príznak zmazať."], ["Ktorý komparátor má vyššiu prioritu (cv5)?", "CCR0 vyššiu než CCR1, preto zelená LED (CCR0) bliká správne aj pri chybe v ISR CCR1."]], "quiz": [["Čo je na adrese <code>0xFFFE<\/code>?", ["Adresa prvej inštrukcie programu (vektor resetu)", "Prvý bajt RAM", "Ukazovateľ zásobníka", "Hodnota P1OUT"], "Vektor resetu. CPU po resete načíta túto hodnotu do PC a začne vykonávať program."], ["Prečo musíme na cv2 označiť premennú v oneskorovacom cykle ako <code>volatile<\/code>?", ["Aby ju prekladač pri optimalizácii nevyhodil a cyklus ostal", "Aby sa uložila do FLASH", "Aby bola 16-bitová", "Aby sa cyklus vykonal raz"], "Bez toho prekladač prázdny cyklus zoptimalizuje preč a delay nič nerobí."], ["Čo sa stane s blikaním LED, ak zmenšíš frekvenciu MCLK na polovicu a nezmeníš kód?", ["Blikajú 2× pomalšie", "Blikajú 2× rýchlejšie", "Blikajú rovnako", "Prestanú blikať"], "Rovnaký počet inštrukcií trvá pri polovičných hodinách 2× dlhšie."], ["Prečo musí cvičenie 3 ošetriť OFIFG pri opakovaní slučky?", ["Po prepnutí na VLO sa LFXT1 vypne a príznak OFIFG ostane nastavený, kým ho nezmažeš", "OFIFG vypína VLO", "OFIFG je len pre DCO", "OFIFG sa nastavuje pri resete"], "Treba ho znova zmazať, počkať 50 µs a testovať, kým ostane 0."], ["Ako sa cv5 vypočíta <code>delta<\/code> pre toggle každú 1 s pri 32 768 Hz?", ["delta = 32768", "delta = 1000", "delta = 65535", "delta = 16384"], "Interval = delta / f, takže delta = f × t = 32768 × 1 s. Pre 0,5 s je to 16384."], ["Prečo červená LED v cv5 svieti trvale slabšie, ak sa v ISR CCR1 nezmaže príznak?", ["ISR sa spúšťa dokola a LED sa prepína veľmi rýchlo", "CCR1 nemá prerušenie", "Príznak sa zmaže sám a LED zhasne", "LED je zapnutá cez PWM"], "CCR1 je viac-príznakové prerušenie. Nezmazaný príznak znamená okamžitý nový štart ISR."]]}];
(function(){
var D = DATA;
var $ = function(s){return document.querySelector(s)};
var store = {};
try { store = JSON.parse(localStorage.getItem('mppi-known-v1')||'{}') || {}; } catch(e){ store = {}; }
function save(){ try { localStorage.setItem('mppi-known-v1', JSON.stringify(store)); } catch(e){} }
var state = {view: 'start', mode: 'explain'};
var cs = {}; // card state per topic
var quizzes = {}; // quiz state per topic

function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function counts(t){ var k=0; t.cards.forEach(function(_,i){ if(store[t.id+'-'+i]) k++; }); return k; }
function updateOverall(){
  var k=0,n=0; D.forEach(function(t){ k+=counts(t); n+=t.cards.length; });
  $('#obar').style.width = (n? k/n*100 : 0) + '%';
  $('#otxt').textContent = k + ' / ' + n + ' kartičiek zvládnutých';
}
function renderNav(){
  $('#nav').innerHTML = D.map(function(t){
    return '<button class="chip" data-v="'+t.id+'" aria-current="'+(state.view===t.id)+'"><span class="n">'+t.n+'</span>'+t.short+' <span class="c">'+counts(t)+'/'+t.cards.length+'</span></button>';
  }).join('') + '<button class="chip" data-v="mix" aria-current="'+(state.view==='mix')+'">Test zo všetkého</button>';
}
$('#nav').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if(!b) return;
  state.view = b.getAttribute('data-v'); state.mode = 'explain'; render(true);
});

function render(scroll){
  renderNav(); updateOverall();
  var v = $('#view');
  if (state.view === 'start') { renderStart(v); }
  else if (state.view === 'mix') { renderMix(v); }
  else { renderTopic(v, D.filter(function(t){return t.id===state.view;})[0]); }
  if (scroll) { var n=$('#nav'); try{ n.scrollIntoView({block:'start'}); }catch(e){} }
}

function renderStart(v){
  v.innerHTML = '<div class="kicker">Začni tu</div><h2>Vyber si tému</h2><p class="lead">Ideálne poradie je 1 až 6. Pri každej téme sú tri časti: <b>Vysvetlenie</b> (porozumieť), <b>Kartičky</b> (zapamätať) a <b>Kvíz</b> (overiť). Na konci môžeš spraviť <b>Test zo všetkého</b>.</p>' +
  '<div class="tw"><table><tr><th>Téma</th><th>Kartičky</th><th></th></tr>' +
  D.map(function(t){ return '<tr><td><b>'+t.n+'. '+t.title+'</b><br><span style="color:var(--muted);font-size:13px">'+t.kicker+'</span></td><td class="mono">'+counts(t)+' / '+t.cards.length+'</td><td><button class="btn" data-go="'+t.id+'">Otvoriť</button></td></tr>'; }).join('') +
  '</table></div>';
  v.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click', function(){ state.view=b.getAttribute('data-go'); state.mode='explain'; render(true); }); });
}

function renderTopic(v, t){
  v.innerHTML = '<div class="kicker">'+t.kicker+'</div><h2>'+t.title+'</h2><p class="lead">'+t.lead+'</p>' +
    '<div class="seg" role="tablist">' +
    [['explain','Vysvetlenie'],['cards','Kartičky ('+t.cards.length+')'],['quiz','Kvíz ('+t.quiz.length+')']].map(function(m){
      return '<button role="tab" data-m="'+m[0]+'" aria-selected="'+(state.mode===m[0])+'">'+m[1]+'</button>'; }).join('') +
    '</div><div class="body" id="body"></div>';
  v.querySelectorAll('.seg button').forEach(function(b){ b.addEventListener('click', function(){ state.mode=b.getAttribute('data-m'); renderTopic(v,t); }); });
  var body = $('#body');
  if (state.mode === 'explain') {
    body.className = 'body explain';
    body.innerHTML = t.explain + '<div class="cta"><button class="btn primary" id="tocards">Ďalej na kartičky</button></div>';
    $('#tocards').addEventListener('click', function(){ state.mode='cards'; renderTopic(v,t); try{$('#nav').scrollIntoView();}catch(e){} });
  } else if (state.mode === 'cards') {
    drawCards(t, body);
  } else {
    if (!quizzes[t.id]) quizzes[t.id] = null;
    startQuiz(prep(t.quiz.map(function(q){ return {q:q[0],o:q[1],why:q[2]}; })), body, 'Kvíz');
  }
}

function drawCards(t, root){
  var s = cs[t.id] || (cs[t.id] = {only:false,pos:0,flip:false});
  var list = []; t.cards.forEach(function(_,i){ if(!s.only || !store[t.id+'-'+i]) list.push(i); });
  if (!list.length) {
    root.innerHTML = '<div class="empty"><p><b>Všetky kartičky tejto témy máš zvládnuté.</b></p><div class="row" style="justify-content:center"><button class="btn" id="showall">Ukázať všetky</button><button class="btn" id="resetT">Vynulovať tému</button></div></div>';
    $('#showall').onclick = function(){ s.only=false; s.pos=0; drawCards(t,root); };
    $('#resetT').onclick = function(){ t.cards.forEach(function(_,i){ delete store[t.id+'-'+i]; }); save(); s.only=false; s.pos=0; render(); };
    return;
  }
  if (s.pos >= list.length) s.pos = 0;
  var i = list[s.pos], c = t.cards[i], key = t.id+'-'+i;
  root.innerHTML = '<div class="deck-top"><span>'+(s.pos+1)+' / '+list.length+(store[key]?'  · zvládnutá':'')+'</span><label><input type="checkbox" id="only"'+(s.only?' checked':'')+'> iba nezvládnuté</label></div>' +
    '<button class="card'+(s.flip?' back':'')+'" id="card" aria-live="polite"><span class="side">'+(s.flip?'Odpoveď':'Otázka')+'</span><span>'+(s.flip?c[1]:c[0])+'</span>'+(s.flip?'':'<span class="hint">Povedz odpoveď nahlas a potom ťukni na kartičku.</span>')+'</button>' +
    '<div class="row"><button class="btn ghost" id="prev" aria-label="Predošlá">←</button><button class="btn bad grow" id="no">Neviem</button><button class="btn good grow" id="yes">Viem</button><button class="btn ghost" id="next" aria-label="Ďalšia">→</button></div>';
  $('#card').onclick = function(){ s.flip = !s.flip; drawCards(t,root); };
  $('#only').onchange = function(e){ s.only = e.target.checked; s.pos = 0; s.flip = false; drawCards(t,root); };
  $('#prev').onclick = function(){ s.pos = (s.pos - 1 + list.length) % list.length; s.flip=false; drawCards(t,root); };
  $('#next').onclick = function(){ s.pos = (s.pos + 1) % list.length; s.flip=false; drawCards(t,root); };
  $('#yes').onclick = function(){ store[key]=true; save(); if(!s.only) s.pos=(s.pos+1)%list.length; s.flip=false; renderNav(); updateOverall(); drawCards(t,root); };
  $('#no').onclick = function(){ delete store[key]; save(); s.pos=(s.pos+1)%list.length; s.flip=false; renderNav(); updateOverall(); drawCards(t,root); };
}

function prep(qs){
  return qs.map(function(q){
    var correct = q.o[0], o = shuffle(q.o);
    return {q:q.q, o:o, a:o.indexOf(correct), why:q.why};
  });
}

function startQuiz(qs, root, title, again){
  var i = 0, score = 0, wrong = [];
  function show(){
    var q = qs[i];
    root.className = 'body';
    root.innerHTML = '<div class="deck-top"><span>Otázka '+(i+1)+' / '+qs.length+'</span><span>Správne: '+score+'</span></div>' +
      '<p class="qtext">'+q.q+'</p><div class="opts">' + q.o.map(function(o,k){ return '<button class="opt" data-k="'+k+'">'+o+'</button>'; }).join('') + '</div><div id="fb"></div>';
    root.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        var k = +b.getAttribute('data-k'), ok = (k === q.a);
        root.querySelectorAll('.opt').forEach(function(x,idx){ x.disabled = true; if(idx===q.a) x.classList.add('right'); });
        if (!ok) { b.classList.add('wrong'); wrong.push(q); } else { score++; }
        $('#fb').innerHTML = '<div class="fb"><b class="'+(ok?'ok':'no')+'">'+(ok?'Správne.':'Nie celkom.')+'</b> '+q.why+'</div><div class="row"><button class="btn primary" id="nq">'+(i+1<qs.length?'Ďalšia otázka':'Zobraziť výsledok')+'</button></div>';
        $('#nq').onclick = function(){ i++; if(i<qs.length) show(); else done(); };
        $('#nq').focus();
      };
    });
  }
  function done(){
    root.innerHTML = '<div class="kicker">Výsledok</div><div class="score">'+score+' / '+qs.length+'</div>' +
      (wrong.length ? '<p>Tieto otázky ti nešli, vráť sa k nim vo vysvetlení a v kartičkách:</p><ul class="wrongs">'+wrong.map(function(q){return '<li>'+q.q+'</li>';}).join('')+'</ul>' : '<p>Všetko správne. Skús ešte raz bez pozerania do poznámok.</p>') +
      '<div class="row"><button class="btn primary" id="again">Znova (nové poradie)</button>'+(wrong.length?'<button class="btn" id="redo">Len chybné</button>':'')+'</div>';
    $('#again').onclick = function(){ if (again) again(); else render(); };
    var r = $('#redo'); if (r) r.onclick = function(){ startQuiz(prep(wrong.map(function(q){ var c=q.o[q.a]; return {q:q.q,o:[c].concat(q.o.filter(function(_,k){return k!==q.a;})),why:q.why}; })), root, title, again); };
  }
  show();
}

function renderMix(v){
  v.innerHTML = '<div class="kicker">Všetky témy</div><h2>Test zo všetkého</h2><p class="lead">15 náhodných otázok z tém 1 až 6. Skús to bez pozerania do poznámok.</p><div class="body" id="body"></div>';
  function go(){
    var all = []; D.forEach(function(t){ t.quiz.forEach(function(q){ all.push({q:q[0],o:q[1],why:q[2]}); }); });
    startQuiz(prep(shuffle(all).slice(0, 15)), $('#body'), 'Test', go);
  }
  go();
}

render(false);
})();
</script>
