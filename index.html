<style>
/* Layout: datasheet-style single column. Sticky topic chips, then per topic: explain / cards / quiz. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#172230; --muted:#566475; --line:#d8dee6;
  --accent:#1f5fcf; --accent-ink:#ffffff; --accent-soft:#e6eefc;
  --mark:#ffe8a3; --code:#e8edf3; --tip:#eaf0f8;
  --good:#146c43; --good-bg:#e0f3e8; --bad:#b3261e; --bad-bg:#fbe3e0;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --surface:#18202a; --ink:#e5eaf0; --muted:#93a1b2; --line:#2a3542;
    --accent:#7fa9ff; --accent-ink:#0b1220; --accent-soft:#1c2a44;
    --mark:#5a4a12; --code:#222c38; --tip:#1b2634;
    --good:#5fd39a; --good-bg:#12301f; --bad:#ff8b82; --bad-bg:#3a1a18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e5eaf0; --muted:#93a1b2; --line:#2a3542;
  --accent:#7fa9ff; --accent-ink:#0b1220; --accent-soft:#1c2a44;
  --mark:#5a4a12; --code:#222c38; --tip:#1b2634;
  --good:#5fd39a; --good-bg:#12301f; --bad:#ff8b82; --bad-bg:#3a1a18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1{font:600 30px/1.1 var(--f-head);margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;max-width:62ch}
.overall{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
nav.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding-block:12px;margin-top:4px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;gap:7px;align-items:baseline;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 14px var(--f-body);cursor:pointer}
.chip .n{font:500 12px var(--f-mono);color:var(--muted)}
.chip .c{font:400 11px var(--f-mono);color:var(--muted)}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-current="true"] .n,.chip[aria-current="true"] .c{color:inherit;opacity:.85}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kicker{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
h2{font:600 26px/1.15 var(--f-head);margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:20px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 8px;font:500 14px var(--f-body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.body{min-width:0}
.explain h3{font:600 20px/1.2 var(--f-head);margin:30px 0 8px;text-wrap:balance}
.explain h3:first-child{margin-top:0}
.explain p,.explain li{max-width:68ch}
.explain ul,.explain ol{padding-left:22px;margin:8px 0}
.explain li{margin:4px 0}
code{font:400 .88em var(--f-mono);background:var(--code);padding:1px 5px;border-radius:4px;white-space:nowrap}
pre{font:400 13.5px/1.5 var(--f-mono);background:var(--code);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:10px 0}
.t{background:var(--mark);font-weight:600;padding:0 3px;border-radius:3px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface);border:1px solid var(--line)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--code)}
td code{white-space:normal}
.tip{background:var(--tip);border-radius:8px;padding:12px 14px;margin:12px 0;max-width:68ch}
.tl{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.note{font-size:14px;color:var(--muted);background:var(--code);border-radius:8px;padding:10px 12px;max-width:68ch}
.cta{display:flex;justify-content:flex-end;margin-top:28px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;font:500 15px var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{padding:10px 14px}
.deck-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 13px var(--f-mono);color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.deck-top label{display:flex;gap:6px;align-items:center;font-family:var(--f-body);cursor:pointer}
.card{display:flex;flex-direction:column;gap:12px;justify-content:center;width:100%;min-height:230px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:22px;cursor:pointer;font:400 19px/1.45 var(--f-body)}
.card.back{border-color:var(--accent);background:var(--accent-soft)}
.card .side{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .hint{font:400 13px var(--f-body);color:var(--muted)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row .grow{flex:1;min-width:110px}
.empty{padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.qtext{font:600 19px/1.4 var(--f-body);margin:6px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font:400 16px/1.45 var(--f-body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--code);max-width:68ch}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}
.score{font:600 44px/1 var(--f-head);margin:8px 0}
.mono{font-family:var(--f-mono)}
.wrongs{margin:14px 0;padding-left:20px}
@media (max-width:480px){h1{font-size:26px}.card{font-size:17px;padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <p class="sub">Pri každej téme najprv prečítaj vysvetlenie, potom si prejdi kartičky (odpoveď povedz nahlas ešte pred otočením) a nakoniec si over seba v kvíze.</p>
